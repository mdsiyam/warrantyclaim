<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty Approval System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
        /* Adjusted styles for the new table structure */
        .status-pill { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .btn-primary { background-color: #4f46e5; color: white; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #4338ca; }
        .input-field { @apply mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500; }
        .admin-action-btn { @apply bg-gray-500 text-white font-semibold py-2 px-3 rounded-lg hover:bg-gray-600 transition text-sm; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="max-w-7xl mx-auto">
        
        <header class="bg-white shadow-lg p-4 mb-8 rounded-xl flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-3xl font-bold text-indigo-700 mb-4 md:mb-0">WarrantyFlow</h1>
            <div id="auth-controls" class="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4 hidden">
                <p id="user-info" class="text-sm font-medium text-gray-700"></p>
                <div class="flex items-center space-x-2">
                    <label for="role-select" class="font-medium text-gray-700 whitespace-nowrap">View as:</label>
                    <select id="role-select" class="p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="field">Field Team</option>
                        <option value="sce">SCE</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button id="logout-btn" class="bg-red-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-600 transition">Logout</button>
            </div>
        </header>

        <div id="auth-container" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-2xl space-y-6">
            <h2 class="text-3xl font-bold text-center text-indigo-600">Sign In</h2>
            <form id="auth-form" class="space-y-4">
                <p class="text-sm text-center text-gray-500">Only authorized users can sign in.</p>
                <div>
                    <label for="auth-email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="auth-email" required class="input-field">
                </div>
                <div>
                    <label for="auth-password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="auth-password" required class="input-field">
                </div>
                <div class="flex space-x-4">
                    <button type="button" id="signin-btn" class="w-full btn-primary py-2 rounded-lg font-semibold">Sign In</button>
                </div>
            </form>
            <p id="auth-message" class="text-center text-red-500 text-sm hidden"></p>
        </div>

        <div id="content-area" class="hidden">
            <div id="loading" class="text-center text-indigo-500 p-8">Loading dashboard...</div>
            <div id="field-dashboard" class="hidden"></div>
            <div id="sce-dashboard" class="hidden"></div>
            <div id="manager-dashboard" class="hidden"></div>
            <div id="admin-dashboard" class="hidden"></div>
        </div>

        <div id="notification-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center p-4 z-40">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
                <h3 id="modal-title" class="text-xl font-bold mb-3 text-gray-800">Success!</h3>
                <p id="modal-message" class="text-gray-600 mb-4">Your action was completed successfully.</p>
                <button onclick="closeModal()" class="w-full btn-primary py-2 rounded-lg font-semibold">Close</button>
            </div>
        </div>
        
        <div id="confirmation-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center p-4 z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
                <h3 id="confirm-title" class="text-xl font-bold mb-3 text-gray-800">Confirm Action</h3>
                <p id="confirm-message" class="text-gray-600 mb-4">Are you sure you want to proceed?</p>
                <div class="flex justify-end space-x-3">
                    <button id="confirm-cancel" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-semibold hover:bg-gray-300 transition">Cancel</button>
                    <button id="confirm-proceed" class="bg-red-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-700 transition">Proceed</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 🚨🚨🚨 ACTION REQUIRED: REPLACE THESE PLACEHOLDERS WITH YOUR ACTUAL SUPABASE CREDENTIALS 🚨🚨🚨
        const SUPABASE_URL = 'https://vebjjlfjlhobatqqwlfq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlYmpqbGZqbGhvYmF0cXF3bGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMzY5NTMsImV4cCI6MjA3NDcxMjk1M30.Ks1ZHFAELRJvh3ppjNdVFPrhiwv7lTYg3mwiLgmSw60'; 
        
        let supabaseClient;
        let isConfigured = true;

        if (SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT_URL') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')) {
            console.error("FATAL ERROR: Please update SUPABASE_URL and SUPABASE_ANON_KEY in the script block.");
            isConfigured = false;
        }

        if (isConfigured) {
             const { createClient } = supabase;
             supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
             // Display a prominent warning if not configured
             document.getElementById('auth-form').innerHTML = `
                 <div class="p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-lg">
                     <p class="font-bold">Configuration Required!</p>
                     <p>Please update the <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> variables in the code.</p>
                 </div>
             `;
        }

        // --- Global State ---
        let currentRole = 'field'; 
        let currentUser = null; 
        let profileListener = null; 
        let currentApprovalTab = 'pending'; // NEW: Track the active tab for SCE/Manager

        // --- DOM Elements ---
        const roleSelect = document.getElementById('role-select');
        const loadingDiv = document.getElementById('loading');
        const fieldDashboard = document.getElementById('field-dashboard');
        const sceDashboard = document.getElementById('sce-dashboard');
        const managerDashboard = document.getElementById('manager-dashboard');
        const adminDashboard = document.getElementById('admin-dashboard');
        const authContainer = document.getElementById('auth-container');
        const contentArea = document.getElementById('content-area');
        const authControls = document.getElementById('auth-controls');
        const userInfo = document.getElementById('user-info');
        
        const signInBtn = document.getElementById('signin-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authMessage = document.getElementById('auth-message');

        const modal = document.getElementById('notification-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        
        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmCancel = document.getElementById('confirm-cancel');
        const confirmProceed = document.getElementById('confirm-proceed');


        // --- Utility Functions ---
        
        function showModal(title, message, isError = false) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (isError) {
                 modalTitle.classList.add('text-red-700');
                 modalTitle.classList.remove('text-gray-800');
            } else {
                 modalTitle.classList.remove('text-red-700');
                 modalTitle.classList.add('text-gray-800');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeModal = function() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            // Reload the dashboard after modal closes to reflect changes
            if (currentUser) loadDashboard(); 
        }
        
        let pendingAction = null;
        function showConfirmation(title, message, onConfirm) {
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            pendingAction = onConfirm;

            confirmProceed.onclick = () => {
                confirmationModal.classList.add('hidden');
                confirmationModal.classList.remove('flex');
                if (pendingAction) {
                    pendingAction();
                }
            };
            confirmCancel.onclick = () => {
                confirmationModal.classList.add('hidden');
                confirmationModal.classList.remove('flex');
                pendingAction = null;
            };

            confirmationModal.classList.remove('hidden');
            confirmationModal.classList.add('flex');
        }

        function getStatusColor(status) {
            switch (status) {
                case 'Submitted': return 'bg-yellow-100 text-yellow-800';
                case 'SCE_Approved': return 'bg-blue-100 text-blue-800';
                case 'SCE_Rejected': return 'bg-red-100 text-red-800';
                case 'Manager_Approved': return 'bg-green-100 text-green-800';
                case 'Manager_Rejected': return 'bg-red-100 text-red-800';
                case 'Closed': return 'bg-gray-200 text-gray-700';
                case 'Admin_Closed': return 'bg-red-200 text-red-900';
                default: return 'bg-gray-100 text-gray-600';
            }
        }

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            // Check if it's a date-only string (like YYYY-MM-DD)
            if (isoString.length === 10 && isoString.includes('-')) {
                 return new Date(isoString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }
            // Otherwise, treat as datetime
            return new Date(isoString).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }
        
        /**
         * Fetches the user's assigned role from the new user_profiles table.
         */
        async function fetchUserRole(userId) {
            if (!supabaseClient) return { role: 'field', name: 'CONFIG_ERROR' };

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('role, email') 
                .eq('id', userId)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.warn("Error fetching user profile:", error.message);
            }
            
            return { 
                role: data?.role || 'field',
                name: data?.email || 'N/A (Role fetch failed)' 
            };
        }

        // --- Authentication Functions ---

        function setAuthMessage(message, isError = true) {
            authMessage.textContent = message;
            authMessage.classList.remove('hidden');
            authMessage.classList.toggle('text-red-500', isError);
            authMessage.classList.toggle('text-green-500', !isError);
        }

        // handleSignUp function REMOVED as per user request

        async function handleSignIn() {
            if (!isConfigured) return setAuthMessage("System not configured. Update credentials first.", true);
            const email = authEmail.value;
            const password = authPassword.value;
            if (!email || !password) return setAuthMessage("Please enter email and password.");

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                setAuthMessage(`Sign in error: ${error.message}`);
            }
        }
        
        async function handleSignOut() {
            if (!isConfigured) return;
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) {
                    console.error("Logout error:", error);
                    showModal('Logout Failed', `There was an issue logging out: ${error.message}`, true);
                } else {
                    console.log("Successfully signed out. UI update triggered by onAuthStateChange.");
                }
            } catch (e) {
                console.error("Critical logout exception:", e);
                showModal('Logout Failed', 'A critical error occurred during logout.', true);
            }
        }


        // --- API Calls (Interacts with RLS) ---

        /**
         * Fetches claims based on the current user's *authenticated* session.
         * The results are automatically filtered by Supabase Row Level Security (RLS).
         */
        async function fetchClaims() {
            if (!currentUser || !isConfigured) return []; 
            
            // The query relies entirely on Supabase RLS to filter what is returned.
            // RLS MUST be configured in the Supabase backend to enforce the claim visibility rules.
            let query = supabaseClient.from('claims').select('*').order('date_raised', { ascending: false });
            
            const { data, error } = await query;
            if (error) {
                console.error(`Error fetching claims as ${currentRole}:`, error);
                // The error often indicates an RLS restriction is preventing data return.
                return []; 
            }
            return data;
        }

        async function submitClaim(claimData) {
            if (!currentUser || !isConfigured) {
                showModal('Error', 'You must be logged in to submit a claim.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('claims')
                .insert({
                    ...claimData,
                    user_id: currentUser.id,
                    raised_by: currentUser.name, 
                    status: 'Submitted', 
                })
                .select();
            
            if (error) {
                console.error('Error submitting claim:', error);
                showModal('Submission Failed', `There was an error: ${error.message}.`);
            } else {
                showModal('Claim Submitted', `Claim #${data[0].id.substring(0, 8)} has been submitted for SCE approval.`);
            }
        }

        async function updateClaimApproval(claimId, action, notes) {
            if (!currentUser || !isConfigured) {
                showModal('Error', 'You must be logged in to approve/reject claims.');
                return;
            }
            
            let updatePayload = {};
            let newStatus;
            let successMessage;

            if (currentRole === 'sce') {
                newStatus = action === 'approve' ? 'SCE_Approved' : 'SCE_Rejected';
                updatePayload = {
                    status: newStatus,
                    sce_approved: action === 'approve',
                    sce_approver_id: currentUser.id,
                    sce_approval_date: new Date().toISOString(),
                    sce_notes: notes
                };
                successMessage = `Claim #${claimId.substring(0, 8)} was ${action === 'approve' ? 'approved' : 'rejected'} by SCE.`;

            } else if (currentRole === 'manager') {
                newStatus = action === 'approve' ? 'Manager_Approved' : 'Manager_Rejected';
                updatePayload = {
                    status: newStatus,
                    manager_approved: action === 'approve',
                    manager_approver_id: currentUser.id,
                    manager_approval_date: new Date().toISOString(),
                    manager_notes: notes
                };
                successMessage = `Claim #${claimId.substring(0, 8)} was ${action === 'approve' ? 'approved' : 'rejected'} by Manager.`;
            } else {
                showModal('Error', 'Your current role does not have approval privileges.');
                return;
            }

            const { error } = await supabaseClient
                .from('claims')
                .update(updatePayload)
                .eq('id', claimId);

            if (error) {
                console.error('Error updating claim status:', error);
                showModal('Update Failed', `There was an error: ${error.message}. This is usually an RLS violation (wrong status or wrong role).`);
            } else {
                showModal('Approval Updated', successMessage);
            }
        }
        
        window.handleAdminAction = async function(claimId, currentStatus) {
             if (!currentUser || currentUser.role !== 'admin' || !isConfigured) {
                showModal('Error', 'Unauthorized action. Only the authenticated Admin role can perform this.');
                return;
            }

            const isClosed = currentStatus.includes('Closed');
            // If currently Closed/Admin_Closed, reopen to Submitted. Otherwise, close it.
            const newStatus = isClosed ? 'Submitted' : 'Admin_Closed';
            const action = isClosed ? 'Reopen' : 'Close';

            showConfirmation(
                `${action} Claim?`,
                `Are you sure you want to ${action.toLowerCase()} claim ${claimId.substring(0, 8)}? This will set the status to: ${newStatus.replace('_', ' ')}.`,
                async () => {
                    const { error } = await supabaseClient
                        .from('claims')
                        .update({ 
                            status: newStatus,
                            admin_action_date: new Date().toISOString(),
                            admin_action_user: currentUser.name
                        })
                        .eq('id', claimId);
        
                    if (error) {
                        console.error('Error updating claim status:', error);
                        showModal('Update Failed', `There was an error: ${error.message}.`);
                    } else {
                        showModal('Claim Updated', `Claim #${claimId.substring(0, 8)} was successfully ${newStatus.replace('_', ' ').toLowerCase()}.`);
                    }
                }
            );
        }
        
        window.handleApprovalClick = function(claimId, action) {
            // Only show the notes field for the currently visible tab
            const notesElement = document.getElementById(`notes-${claimId}`);
            const notes = notesElement ? notesElement.value : '';
            
            showConfirmation(
                `${action.charAt(0).toUpperCase() + action.slice(1)} Claim?`,
                `Are you sure you want to ${action} claim ${claimId.substring(0, 8)}?`,
                () => {
                    updateClaimApproval(claimId, action, notes);
                }
            );
        }


        // --- Dashboard Rendering ---

        /**
         * Renders the full details card for a claim, including actions if allowed.
         */
        function renderClaimItem(claim, showActions = false, isAdminView = false) {
            const statusClass = getStatusColor(claim.status);

            let actionsHtml = '';
            
            // LOGIC TO DETERMINE IF APPROVAL BUTTONS SHOULD SHOW
            const isPendingSCE = claim.status === 'Submitted' && currentRole === 'sce';
            const isPendingManager = claim.status === 'SCE_Approved' && currentRole === 'manager';
            // Only show actions if the user is on the 'pending' tab
            const showApprovalButtons = showActions && currentApprovalTab === 'pending' && currentUser.role === currentRole && (isPendingSCE || isPendingManager);
            
            if (showApprovalButtons) { 
                actionsHtml = `
                    <div class="mt-4 flex flex-col space-y-2">
                        <textarea id="notes-${claim.id}" class="w-full p-2 border border-gray-300 rounded-lg text-sm" placeholder="Add approval/rejection notes..."></textarea>
                        <div class="flex space-x-2">
                            <button onclick="handleApprovalClick('${claim.id}', 'approve')" class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition">Approve</button>
                            <button onclick="handleApprovalClick('${claim.id}', 'reject')" class="w-full bg-red-600 text-white font-semibold py-2 rounded-lg hover:bg-red-700 transition">Reject</button>
                        </div>
                    </div>
                `;
            } else if (isAdminView && currentUser.role === 'admin') { 
                 const actionText = (claim.status === 'Admin_Closed' || claim.status === 'Closed') ? 'Reopen Claim' : 'Close Claim';
                 const buttonColor = (claim.status === 'Admin_Closed' || claim.status === 'Closed') ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-gray-700 hover:bg-gray-800';
                 actionsHtml = `
                    <div class="mt-4">
                        <button onclick="handleAdminAction('${claim.id}', '${claim.status}')" class="w-full ${buttonColor} text-white font-semibold py-2 rounded-lg transition">${actionText}</button>
                    </div>
                `;
            }
            
            const sceDecision = claim.sce_approval_date ? `<p class="text-xs text-gray-500 mt-1">SCE (${claim.sce_approver_id?.substring(0, 8)}): <span class="font-medium">${claim.sce_approved ? 'Approved' : 'Rejected'}</span> on ${formatDate(claim.sce_approval_date)}<span class="ml-2 italic text-gray-400">Notes: ${claim.sce_notes || 'N/A'}</span></p>` : '';
            const managerDecision = claim.manager_approval_date ? `<p class="text-xs text-gray-500 mt-1">Manager (${claim.manager_approver_id?.substring(0, 8)}): <span class="font-medium">${claim.manager_approved ? 'Approved' : 'Rejected'}</span> on ${formatDate(claim.manager_approval_date)}<span class="ml-2 italic text-gray-400">Notes: ${claim.manager_notes || 'N/A'}</span></p>` : '';
            const adminAction = claim.admin_action_date ? `<p class="text-xs ${claim.status.includes('Admin') ? 'text-red-500' : 'text-gray-500'} mt-1">Admin Action by ${claim.admin_action_user || 'N/A'}: Status set to ${claim.status.replace('_', ' ')} on ${formatDate(claim.admin_action_date)}</p>` : '';

            return `
                <div class="bg-white p-4 border border-gray-100 rounded-xl shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="text-lg font-semibold text-gray-800">${claim.title}</h4>
                        <span class="status-pill ${statusClass}">${claim.status.replace('_', ' ')}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">Claim ID: <code class="font-mono text-xs">${claim.id.substring(0, 8)}</code></p>
                    <p class="text-sm text-gray-600 mb-2">Raised By: <span class="font-medium text-indigo-500">${claim.raised_by}</span> (User ID: ${claim.user_id.substring(0, 8)})</p>
                    
                    <div class="mt-4 p-3 bg-indigo-50 rounded-lg space-y-1 border border-indigo-200">
                        <p class="text-sm text-gray-700">Customer: <span class="font-medium">${claim.customer_name || 'N/A'}</span></p>
                        <p class="text-sm text-gray-700">Model: <span class="font-medium">${claim.machine_model || 'N/A'}</span> / S/N: <span class="font-medium">${claim.equipment_serial}</span></p>
                        <p class="text-sm text-gray-700">Run Hours: <span class="font-medium">${claim.running_hour || 'N/A'}</span></p>
                        <p class="text-sm text-gray-700">Failure Component: <span class="font-medium">${claim.failure_component || 'N/A'}</span> (Part No: ${claim.failure_part_no || 'N/A'})</p>
                        <p class="text-sm text-gray-700">Failure Date: <span class="font-medium">${formatDate(claim.failure_date) || 'N/A'}</span></p>
                    </div>

                    <p class="text-sm text-gray-600 mt-4 mb-4 italic whitespace-pre-wrap">${claim.description}</p>
                    <p class="text-xs text-gray-500">Submitted: ${formatDate(claim.date_raised)}</p>

                    <div class="mt-3 p-3 bg-gray-50 rounded-lg space-y-2 border border-gray-200">
                        ${sceDecision}
                        ${managerDecision}
                        ${adminAction}
                    </div>
                    ${actionsHtml}
                </div>
            `;
        }
        
        // MODIFIED: Shared logic for rendering the expandable claim table
        function renderClaimTable(claims, showActions = false, isAdminView = false) {
            if (claims.length === 0) {
                return '<p class="text-gray-500 p-4 bg-white rounded-lg shadow-sm">No claims found for this view.</p>';
            }

            const tableRows = claims.map(claim => {
                const detailsId = `details-${claim.id}`;
                
                // Summary Row (Clickable) - ADDED data-claim-id AND class 'claim-summary-row'
                const summaryRow = `
                    <tr data-claim-id="${claim.id}" class="claim-summary-row hover:bg-indigo-50 transition duration-150 ease-in-out cursor-pointer">
                        <td class="px-6 py-4 font-mono text-sm text-gray-900">${claim.id.substring(0, 8)}</td>
                        <td class="px-6 py-4 text-sm font-medium text-gray-700">${claim.customer_name || 'N/A'}</td>
                        <td class="px-6 py-4">
                            <span class="status-pill ${getStatusColor(claim.status)}">${claim.status.replace('_', ' ')}</span>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-indigo-600">
                            <svg class="w-4 h-4 inline-block transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </td>
                    </tr>
                `;
                
                // Hidden Details Row (Full Card View)
                const detailsRow = `
                    <tr id="${detailsId}" class="claim-details-row hidden"> 
                        <td colspan="4" class="p-0 border-none">
                            <div class="p-6 bg-white border-t border-indigo-200 w-full">
                                ${renderClaimItem(claim, showActions, isAdminView)}
                            </div>
                        </td>
                    </tr>
                `;
                
                return summaryRow + detailsRow;
            }).join('');

            return `
                <div class="overflow-x-auto shadow-lg rounded-xl">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-indigo-600">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Claim ID</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Customer Name</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Status</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Details</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        /**
         * Function for Field Dashboard tab switching.
         */
        window.switchFieldTab = function(tabName) {
            const historyTab = document.getElementById('claim-history-tab');
            const newClaimTab = document.getElementById('new-claim-tab');
            const historyContent = document.getElementById('claim-history-content');
            const newClaimContent = document.getElementById('new-claim-content');

            if (tabName === 'history') {
                historyTab.classList.add('border-indigo-500', 'text-indigo-600');
                historyTab.classList.remove('border-transparent', 'text-gray-500');
                newClaimTab.classList.remove('border-indigo-500', 'text-indigo-600');
                newClaimTab.classList.add('border-transparent', 'text-gray-500');
                historyContent.classList.remove('hidden');
                newClaimContent.classList.add('hidden');
            } else {
                newClaimTab.classList.add('border-indigo-500', 'text-indigo-600');
                newClaimTab.classList.remove('border-transparent', 'text-gray-500');
                historyTab.classList.remove('border-indigo-500', 'text-indigo-600');
                historyTab.classList.add('border-transparent', 'text-gray-500');
                newClaimContent.classList.remove('hidden');
                historyContent.classList.add('hidden');
            }
        }
        
        /**
         * NEW: Function for Approval Dashboard tab switching (SCE and Manager).
         */
        window.switchApprovalTab = function(role, tabName) {
            currentApprovalTab = tabName;
            
            const dashboardId = role + '-dashboard';
            
            // Update Tab Headers
            document.querySelectorAll(`#${dashboardId} nav button`).forEach(btn => {
                const btnTabName = btn.getAttribute('data-tab-name');
                if (btnTabName === tabName) {
                    btn.classList.add('border-indigo-500', 'text-indigo-600');
                    btn.classList.remove('border-transparent', 'text-gray-500');
                } else {
                    btn.classList.remove('border-indigo-500', 'text-indigo-600');
                    btn.classList.add('border-transparent', 'text-gray-500');
                }
            });

            // Update Tab Content
            document.querySelectorAll(`#${dashboardId} .tab-content`).forEach(content => {
                if (content.id === `${role}-${tabName}-content`) {
                    content.classList.remove('hidden');
                } else {
                    content.classList.add('hidden');
                }
            });
        }

        function renderFieldDashboard(claims) {
            const claimHistoryTable = renderClaimTable(claims, false, false); // false = no actions, not admin view
            
            fieldDashboard.innerHTML = `
                <div class="bg-white p-6 border border-gray-100 rounded-xl shadow-lg">
                    <h2 class="text-3xl font-bold text-indigo-700 mb-6">Field Team Dashboard</h2>

                    <div class="border-b border-gray-200 mb-6">
                        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                            <button id="new-claim-tab" onclick="switchFieldTab('new')"
                                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm border-indigo-500 text-indigo-600">
                                New Claim Submission
                            </button>
                            <button id="claim-history-tab" onclick="switchFieldTab('history')"
                                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                                Claim History (${claims.length})
                            </button>
                        </nav>
                    </div>

                    <div id="new-claim-content" class="">
                        <div class="max-w-xl mx-auto bg-white p-6 border border-indigo-100 rounded-xl shadow-lg h-fit">
                            <h3 class="text-2xl font-bold text-indigo-700 mb-4">Submit New Claim</h3>
                            <form id="new-claim-form" class="space-y-4">
                                <h4 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2">Customer & Machine</h4>
                                <div>
                                    <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                                    <input type="text" id="customer-name" required class="input-field">
                                </div>
                                <div>
                                    <label for="machine-model" class="block text-sm font-medium text-gray-700">Machine Model</label>
                                    <input type="text" id="machine-model" required class="input-field">
                                </div>
                                <div>
                                    <label for="claim-serial" class="block text-sm font-medium text-gray-700">Serial Number</label>
                                    <input type="text" id="claim-serial" required class="input-field">
                                </div>
                                <div>
                                    <label for="running-hour" class="block text-sm font-medium text-gray-700">Running Hours (Approx)</label>
                                    <input type="number" id="running-hour" class="input-field" step="1" min="0" placeholder="e.g., 5000">
                                </div>

                                <h4 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2 pt-2">Failure Information</h4>
                                <div>
                                    <label for="failure-date" class="block text-sm font-medium text-gray-700">Failure Date</label>
                                    <input type="date" id="failure-date" required class="input-field">
                                </div>
                                <div>
                                    <label for="failure-component" class="block text-sm font-medium text-gray-700">Failure Component</label>
                                    <input type="text" id="failure-component" required class="input-field" placeholder="e.g., Hydraulic Pump, Engine Belt">
                                </div>
                                <div>
                                    <label for="failure-part-no" class="block text-sm font-medium text-gray-700">Part No. of Failure Component</label>
                                    <input type="text" id="failure-part-no" class="input-field" placeholder="Optional">
                                </div>
                                
                                <h4 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2 pt-2">Problem Description</h4>
                                <div>
                                    <label for="claim-title" class="block text-sm font-medium text-gray-700">Claim Summary / Problem</label>
                                    <input type="text" id="claim-title" required class="input-field" placeholder="Short summary of the issue">
                                </div>
                                <div>
                                    <label for="claim-description" class="block text-sm font-medium text-gray-700">Detailed Description of Fault</label>
                                    <textarea id="claim-description" rows="4" required class="input-field"></textarea>
                                </div>

                                <button type="submit" class="w-full btn-primary py-2 rounded-lg font-semibold">Submit Claim</button>
                            </form>
                        </div>
                    </div>

                    <div id="claim-history-content" class="hidden">
                        <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-indigo-400 bg-indigo-50 py-2">Data displayed here is filtered by the backend security policies. You only see claims you raised.</p>
                        ${claimHistoryTable}
                    </div>
                </div>
            `;
            
            // Reattach form submission listener
            document.getElementById('new-claim-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Get form fields
                const customerName = document.getElementById('customer-name').value;
                const machineModel = document.getElementById('machine-model').value;
                const runningHour = document.getElementById('running-hour').value;
                const failureDate = document.getElementById('failure-date').value;
                const failureComponent = document.getElementById('failure-component').value;
                const failurePartNo = document.getElementById('failure-part-no').value;
                const title = document.getElementById('claim-title').value;
                const serial = document.getElementById('claim-serial').value;
                const description = document.getElementById('claim-description').value;

                const claimPayload = { 
                    title: title, equipment_serial: serial, description: description,
                    customer_name: customerName, machine_model: machineModel,
                    running_hour: runningHour ? parseFloat(runningHour) : null,
                    failure_date: failureDate, failure_component: failureComponent,
                    failure_part_no: failurePartNo
                };

                await submitClaim(claimPayload);
                e.target.reset();
                switchFieldTab('history'); // Switch to history after submission
            });
        }
        
        /**
         * MODIFIED: Renders the SCE/Manager approval dashboards with two tabs.
         */
        function renderApprovalDashboard(claimsByStatus, title, targetDiv, roleId) { 
            const pendingClaims = claimsByStatus.pending;
            const approvedClaims = claimsByStatus.approved;
            
            // Pending tab needs to show approval actions (showActions = true)
            const pendingTable = renderClaimTable(pendingClaims, true); 
            // Approved tab does not need approval actions (showActions = false)
            const approvedTable = renderClaimTable(approvedClaims, false); 

            targetDiv.innerHTML = `
                <div id="${roleId}-dashboard-content" class="bg-white p-6 border border-gray-100 rounded-xl shadow-lg">
                    <h2 class="text-3xl font-bold text-indigo-700 mb-6">${title}</h2>

                    <div class="border-b border-gray-200 mb-6">
                        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                            <button data-tab-name="pending" onclick="switchApprovalTab('${roleId}', 'pending')"
                                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                                Claims Pending Approval (${pendingClaims.length})
                            </button>
                            <button data-tab-name="approved" onclick="switchApprovalTab('${roleId}', 'approved')"
                                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                                History (Approved/Rejected) (${approvedClaims.length})
                            </button>
                        </nav>
                    </div>

                    <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-indigo-400 bg-indigo-50 py-2">Click any row to view full details and take action where applicable.</p>

                    <div id="${roleId}-pending-content" class="tab-content">
                        ${pendingClaims.length > 0 ? pendingTable : '<p class="text-gray-500">No claims currently pending your approval.</p>'}
                    </div>

                    <div id="${roleId}-approved-content" class="tab-content hidden">
                        ${approvedClaims.length > 0 ? approvedTable : '<p class="text-gray-500">No claims have been approved or rejected yet.</p>'}
                    </div>
                </div>
            `;
            
            // Set initial tab state to 'pending'
            window.switchApprovalTab(roleId, 'pending');
        }
        
        // MODIFIED: Switched from card grid to expandable table
        function renderAdminDashboard(claims) {
            const tableHtml = renderClaimTable(claims, false, true); // false = no approval actions, true = is Admin view
            adminDashboard.innerHTML = `
                <div class="bg-white p-6 border border-gray-100 rounded-xl shadow-lg">
                    <h2 class="text-3xl font-bold text-red-700 mb-6">Admin Master View (All Claims: ${claims.length})</h2>
                    <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-red-400 bg-red-50 py-2">As **Admin**, you bypass all RLS filters and see all claims in the database. Click any row for details and actions.</p>
                    ${claims.length > 0 ? tableHtml : '<p class="text-gray-500">No claims found in the database.</p>'}
                </div>
            `;
        }

        // --- Main Controller ---

        function switchDashboard(role) {
            // Hide all
            fieldDashboard.classList.add('hidden');
            sceDashboard.classList.add('hidden');
            managerDashboard.classList.add('hidden');
            adminDashboard.classList.add('hidden');

            currentRole = role;
            currentApprovalTab = 'pending'; // Reset approval tab state on role switch

            // Show current one
            if (role === 'field') {
                fieldDashboard.classList.remove('hidden');
            } else if (role === 'sce') {
                sceDashboard.classList.remove('hidden');
            } else if (role === 'manager') {
                managerDashboard.classList.remove('hidden');
            } else if (role === 'admin') { 
                adminDashboard.classList.remove('hidden');
            }
            
            loadDashboard();
        }

        async function loadDashboard() {
            if (!currentUser) return;

            loadingDiv.classList.remove('hidden');
            
            // This is the call that is filtered by RLS on the Supabase side
            const claims = await fetchClaims();
            
            loadingDiv.classList.add('hidden');

            if (currentRole === 'field') {
                renderFieldDashboard(claims);
            } else if (currentRole === 'sce') {
                // NEW Filtering Logic for SCE
                const pendingClaims = claims.filter(c => c.status === 'Submitted');
                const approvedClaims = claims.filter(c => c.status === 'SCE_Approved' || c.status === 'SCE_Rejected');
                renderApprovalDashboard({ pending: pendingClaims, approved: approvedClaims }, 'SCE Approval Dashboard', sceDashboard, 'sce');
            } else if (currentRole === 'manager') {
                // NEW Filtering Logic for Manager
                const pendingClaims = claims.filter(c => c.status === 'SCE_Approved');
                const approvedClaims = claims.filter(c => c.status === 'Manager_Approved' || c.status === 'Manager_Rejected');
                renderApprovalDashboard({ pending: pendingClaims, approved: approvedClaims }, 'Manager Approval Dashboard', managerDashboard, 'manager');
            } else if (currentRole === 'admin') {
                renderAdminDashboard(claims);
            }
        }
        
        function refreshDashboardFromPayload(newProfileData) {
            const newRole = newProfileData.role;
            const newName = newProfileData.email;
            
            if (currentUser.role === newRole) {
                console.log(`Role is already ${newRole}. No change needed from Realtime payload.`);
                return;
            }

            // 1. Update global state
            currentUser.role = newRole;
            currentUser.name = newName;
            currentRole = newRole;

            // 2. Update UI header
            userInfo.textContent = `User: ${currentUser.name} (Role: ${currentUser.role})`;
            
            // 3. Update role selector state
            roleSelect.value = currentRole;
            roleSelect.disabled = (currentRole !== 'admin');
            roleSelect.title = (currentRole !== 'admin') ? `Access restricted to ${currentRole} view.` : `Admin can view all roles.`;

            // 4. Switch dashboard view and reload data
            switchDashboard(currentRole);
            showModal("Role Updated", `Your role has been updated to **${newRole}**. The dashboard has been refreshed.`);
        }
        
        function startRoleListener(userId) {
            if (profileListener) {
                supabaseClient.removeChannel(profileListener);
            }
            
            profileListener = supabaseClient
                .channel('roles_channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user_profiles' }, async (payload) => {
                    if (currentUser && payload.new.id === userId) {
                         console.log("User role update detected via real-time payload:", payload.new.role);
                         refreshDashboardFromPayload(payload.new);
                    }
                })
                .subscribe();
        }

        function stopRoleListener() {
            if (profileListener) {
                supabaseClient.removeChannel(profileListener);
                profileListener = null;
            }
        }

        async function updateUI(session) {
            if (session) {
                startRoleListener(session.user.id);
                
                authContainer.classList.add('hidden');
                contentArea.classList.remove('hidden');
                authControls.classList.remove('hidden');
                
                const { role, name } = await fetchUserRole(session.user.id);
                
                currentUser = { id: session.user.id, name: name, role: role };
                
                userInfo.textContent = `User: ${currentUser.name} (Role: ${currentUser.role})`;
                
                roleSelect.value = currentUser.role;
                currentRole = currentUser.role;
                
                roleSelect.disabled = (currentUser.role !== 'admin');
                if (currentUser.role !== 'admin') {
                    roleSelect.title = `Access restricted to ${currentUser.role} view.`;
                } else {
                     roleSelect.title = `Admin can view all roles.`;
                }
                
                switchDashboard(currentRole);

            } else {
                stopRoleListener(); 
                currentUser = null;
                currentRole = 'field'; 
                authContainer.classList.remove('hidden');
                contentArea.classList.add('hidden');
                authControls.classList.add('hidden');
                
                authMessage.classList.add('hidden');
                authEmail.value = '';
                authPassword.value = '';
            }
        }

        // --- Event Delegation for Table Row Click (The Fix) ---
        document.addEventListener('click', function(e) {
            // Find the closest ancestor element that is a TR with the 'claim-summary-row' class
            let targetRow = e.target.closest('.claim-summary-row');
            
            if (targetRow) {
                // Get the TR immediately following the summary row, which is the details row
                const detailsRow = targetRow.nextElementSibling;
                // Find the icon within the clicked row to rotate it
                const icon = targetRow.querySelector('svg'); 

                if (detailsRow && detailsRow.tagName === 'TR') {
                    // Perform the toggle logic
                    if (detailsRow.classList.contains('hidden')) {
                        detailsRow.classList.remove('hidden');
                        if (icon) icon.classList.add('rotate-90');
                    } else {
                        detailsRow.classList.add('hidden');
                        if (icon) icon.classList.remove('rotate-90');
                    }
                }
            }
        });
        
        // --- Initialization ---
        
        signInBtn.addEventListener('click', handleSignIn);
        logoutBtn.addEventListener('click', handleSignOut);

        roleSelect.addEventListener('change', (e) => {
            if (currentUser && currentUser.role === 'admin') {
                switchDashboard(e.target.value);
            } else {
                e.target.value = currentUser.role;
            }
        });
        
        if (isConfigured) {
            // 1. Initial Auth check and setup the auth listener
            supabaseClient.auth.onAuthStateChange((event, session) => {
                updateUI(session);
            });
            
            // 2. Real-time listener: loads the dashboard on any claims data change
            supabaseClient
                .channel('claims_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'claims' }, (payload) => {
                    if (currentUser) {
                         loadDashboard();
                    }
                })
                .subscribe();
        } 
    </script>
</body>
</html>
