<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Warranty Approval System</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .hidden { display: none; }
    .claim-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; }
    .pending { color: orange; }
    .approved { color: green; }
    .rejected { color: red; }
  </style>
</head>
<body>
  <h2>Warranty Approval System</h2>

  <!-- Login -->
  <div id="login-section">
    <input id="email" type="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>

  <!-- Logout -->
  <div id="logout-section" class="hidden">
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Field User: New Claim Form -->
  <div id="claim-form" class="hidden">
    <h3>Submit New Claim</h3>
    <input id="customer_name" placeholder="Customer Name"><br>
    <input id="machine_model" placeholder="Machine Model"><br>
    <input id="serial_no" placeholder="Serial No"><br>
    <input id="running_hour" placeholder="Running Hour" type="number"><br>
    <input id="problem" placeholder="Problem"><br>
    <textarea id="description" placeholder="Description"></textarea><br>
    <input id="failure_component" placeholder="Failure Component"><br>
    <input id="part_no" placeholder="Part No"><br>
    <input id="failure_date" type="date"><br>
    <button onclick="submitClaim()">Submit Claim</button>
  </div>

  <!-- Claims List -->
  <div id="claims-list" class="hidden">
    <h3>Your Claims / Pending Approvals</h3>
    <div id="claims-container"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://vbxnkdwdbowvxuozsroh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZieG5rZHdkYm93dnh1b3pzcm9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMjIwODgsImV4cCI6MjA3NDY5ODA4OH0._j9jY5wgNKbXUu2ZMpOx_kx7EVYU99Hi5TYsXR34g9g";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentRole = null;

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { alert("Login error: " + error.message); return; }

      currentUser = data.user;

      // Get role from profiles
      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", currentUser.id)
        .single();

      console.log("Fetched profile:", profile, "profileError:", profileError);

      if (profileError || !profile) {
        alert("No role found for this user. Please check profiles table.");
        return;
      }

      currentRole = profile.role;
      alert("Logged in as: " + currentRole);

      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("logout-section").classList.remove("hidden");

      if (currentRole === "field") {
        document.getElementById("claim-form").classList.remove("hidden");
      }
      document.getElementById("claims-list").classList.remove("hidden");

      loadClaims();
    }

    async function logout() {
      await supabase.auth.signOut();
      currentUser = null;
      currentRole = null;

      document.getElementById("login-section").classList.remove("hidden");
      document.getElementById("logout-section").classList.add("hidden");
      document.getElementById("claim-form").classList.add("hidden");
      document.getElementById("claims-list").classList.add("hidden");
      document.getElementById("claims-container").innerHTML = "";
    }

    async function submitClaim() {
      const claim = {
        customer_name: document.getElementById("customer_name").value,
        machine_model: document.getElementById("machine_model").value,
        serial_no: document.getElementById("serial_no").value,
        running_hour: document.getElementById("running_hour").value,
        problem: document.getElementById("problem").value,
        description: document.getElementById("description").value,
        failure_component: document.getElementById("failure_component").value,
        part_no: document.getElementById("part_no").value,
        failure_date: document.getElementById("failure_date").value,
        created_by: currentUser.id,
        service_manager_approval: "Pending",
        warranty_manager_approval: "Pending",
        final_decision: "Pending"
      };

      const { error } = await supabase.from("warranty_claims").insert([claim]);
      if (error) { alert("Error submitting claim: " + error.message); return; }

      alert("Claim submitted!");
      document.getElementById("claim-form").reset;
      loadClaims();
    }

    async function loadClaims() {
      let query = supabase.from("warranty_claims").select("*");

      if (currentRole === "field") {
        query = query.eq("created_by", currentUser.id);
      } else if (currentRole === "service_manager") {
        query = query.eq("service_manager_approval", "Pending");
      } else if (currentRole === "warranty_manager") {
        query = query.eq("service_manager_approval", "Approved").eq("warranty_manager_approval", "Pending");
      }

      const { data: claims, error } = await query;
      if (error) { console.error(error); return; }

      const container = document.getElementById("claims-container");
      container.innerHTML = "";

      claims.forEach(claim => {
        const div = document.createElement("div");
        div.className = "claim-card";
        div.innerHTML = `
          <b>${claim.customer_name}</b> (${claim.machine_model}, ${claim.serial_no})<br>
          Problem: ${claim.problem}<br>
          Status: Service: <span class="${claim.service_manager_approval.toLowerCase()}">${claim.service_manager_approval}</span>, 
          Warranty: <span class="${claim.warranty_manager_approval.toLowerCase()}">${claim.warranty_manager_approval}</span>, 
          Final: <span class="${claim.final_decision.toLowerCase()}">${claim.final_decision}</span><br>
        `;

        if (currentRole === "service_manager" && claim.service_manager_approval === "Pending") {
          div.innerHTML += `
            <button onclick="updateClaim('${claim.id}','service_manager_approval','Approved')">Approve</button>
            <button onclick="updateClaim('${claim.id}','service_manager_approval','Rejected')">Reject</button>
          `;
        }

        if (currentRole === "warranty_manager" && claim.warranty_manager_approval === "Pending") {
          div.innerHTML += `
            <button onclick="updateClaim('${claim.id}','warranty_manager_approval','Approved')">Approve</button>
            <button onclick="updateClaim('${claim.id}','warranty_manager_approval','Rejected')">Reject</button>
          `;
        }

        container.appendChild(div);
      });
    }

    async function updateClaim(id, field, value) {
      const { error } = await supabase
        .from("warranty_claims")
        .update({ [field]: value })
        .eq("id", id);
      if (error) { alert("Error updating claim: " + error.message); return; }
      loadClaims();
    }
  </script>
</body>
</html>
