<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty Approval System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJc5n/i3T8S59hWvD27s51F4wW22s8N+7o+K60C6u3e54l36R4l9z6B4f40f353B" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* CSS for Visual Overhaul */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        /* General Look and Feel */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #1e293b; /* Deep Slate Gray / Indigo background for login screen */
            min-height: 100vh;
            /* Flex layout to center the login form before it is hidden */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0; /* Remove padding from body */
        } 
        
        /* Utility Classes for Components */
        .status-pill { 
            padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; 
        }
        .btn-primary { 
            /* Added animation and scale on hover */
            @apply bg-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:bg-indigo-700 hover:shadow-2xl transition duration-300 ease-in-out transform hover:scale-[1.01]; 
        }
        .input-field { 
            /* Added smooth focus transition and padding for icons */
            @apply mt-1 w-full p-3 border border-gray-300 rounded-xl bg-white shadow-sm focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition duration-300; 
        }
        .card-base { 
            /* Main card style for dashboards */
            @apply bg-white p-8 rounded-2xl shadow-xl transition duration-300 ease-in-out hover:shadow-2xl hover:border-indigo-100; 
        }
        
        /* NEW LOGIN PAGE STYLES */
        #auth-container {
             /* Narrower and centered card for maximum focus */
            max-width: 30rem; 
            padding: 0;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
            overflow: hidden; 
        }

        /* Styles for the main content area (dashboard) when logged in */
        #content-area-wrapper {
            max-width: 80rem; 
            width: 100%;
            margin: 0 auto;
            padding: 1rem 2rem; /* Padding for dashboard */
        }
    </style>
</head>

<body class="min-h-screen"> 
    <header id="main-header" class="bg-white shadow-lg p-4 rounded-2xl flex flex-col md:flex-row justify-between items-center sticky top-4 z-10 border-b border-indigo-100 w-full max-w-7xl mx-auto mb-8 hidden">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-4 md:mb-0">WarrantyFlow</h1>
        <div id="auth-controls" class="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4 hidden">
            <p id="user-info" class="text-sm font-medium text-gray-700"></p>
            <div class="flex items-center space-x-2">
                <label for="role-select" class="font-medium text-gray-700 whitespace-nowrap">View as:</label>
                <select id="role-select" class="p-2 border border-gray-300 rounded-xl shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                    <option value="field">Field Team</option>
                    <option value="sce">SCE</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button id="logout-btn" class="bg-red-600 text-white py-2 px-4 rounded-xl font-semibold hover:bg-red-700 transition duration-300 hover:scale-[1.05]">
                <i class="fas fa-sign-out-alt mr-1"></i>Logout
            </button>
        </div>
    </header>

    <div id="auth-container" class="mx-auto rounded-2xl shadow-2xl">
        <div class="bg-indigo-600 p-8 text-white rounded-t-2xl">
            <div class="flex items-center space-x-3">
                <i class="fas fa-tools text-4xl"></i>
                <h2 class="text-3xl font-extrabold">WarrantyFlow Login</h2>
            </div>
            <p class="text-indigo-200 mt-2">Access your claim management dashboard.</p>
        </div>
        
        <div class="p-8 space-y-6">
             <h3 class="text-2xl font-bold text-gray-800">Sign In / Register</h3>
             <p class="text-sm text-center text-gray-500">New users get the **Field Team** role by default.</p>
             <form id="auth-form" class="space-y-6">
                
                <div>
                    <label for="auth-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="email" id="auth-email" required class="input-field pl-12" placeholder="user@example.com">
                    </div>
                </div>
                
                <div>
                    <label for="auth-password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="password" id="auth-password" required class="input-field pl-12" placeholder="Enter your password">
                    </div>
                </div>
                
                <div class="flex space-x-4 pt-4">
                    <button type="button" id="signin-btn" class="w-1/2 btn-primary py-3 rounded-xl font-bold flex items-center justify-center space-x-2">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Sign In</span>
                    </button>
                    <button type="button" id="signup-btn" class="w-1/2 bg-indigo-500 text-white py-3 rounded-xl font-semibold hover:bg-indigo-600 transition flex items-center justify-center space-x-2">
                        <i class="fas fa-user-plus"></i>
                        <span>Register</span>
                    </button>
                </div>
            </form>
            <p id="auth-message" class="text-center text-red-500 text-sm hidden"></p>
        </div>
    </div>

    <div id="content-area-wrapper" class="hidden">
        <div id="loading" class="text-center text-indigo-500 p-8">Loading dashboard...</div>
        <div id="field-dashboard" class="hidden"></div>
        <div id="sce-dashboard" class="hidden"></div>
        <div id="manager-dashboard" class="hidden"></div>
        <div id="admin-dashboard" class="hidden"></div>
    </div>

    <div id="notification-modal" class="fixed inset-0 bg-gray-900 bg-opacity-70 hidden items-center justify-center p-4 z-40">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 ease-out">
            <h3 id="modal-title" class="text-2xl font-bold mb-3 text-gray-800">Success!</h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <button onclick="closeModal()" class="w-full btn-primary py-2 rounded-xl font-semibold">
                <i class="fas fa-times-circle mr-1"></i>Close
            </button>
        </div>
    </div>
    
    <div id="confirmation-modal" class="fixed inset-0 bg-gray-900 bg-opacity-70 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 ease-out">
            <h3 id="confirm-title" class="text-2xl font-bold mb-3 text-gray-800">Confirm Action</h3>
            <p id="confirm-message" class="text-gray-600 mb-6">Are you sure you want to proceed?</p>
            <div class="flex justify-end space-x-3">
                <button id="confirm-cancel" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-xl font-semibold hover:bg-gray-300 transition">
                    <i class="fas fa-ban mr-1"></i>Cancel
                </button>
                <button id="confirm-proceed" class="bg-red-600 text-white py-2 px-4 rounded-xl font-semibold hover:bg-red-700 transition">
                    <i class="fas fa-check-circle mr-1"></i>Proceed
                </button>
            </div>
        </div>
    </div>


    <script type="module">
        // 🚨🚨🚨 ACTION REQUIRED: REPLACE THESE PLACEHOLDERS WITH YOUR ACTUAL SUPABASE CREDENTIALS 🚨🚨🚨
        const SUPABASE_URL = 'https://vebjjlfjlhobatqqwlfq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlYmpqbGZqbGhvYmF0cXF3bGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMzY5NTMsImV4cCI6MjA3NDcxMjk1M30.Ks1ZHFAELRJvh3ppjNdVFPrhiwv7lTYg3mwiLgmSw60'; 
        
        let supabaseClient;
        let isConfigured = true;

        if (SUPABASE_URL.includes('YOUR_SUPABASE_PROJECT_URL') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')) {
            console.error("FATAL ERROR: Please update SUPABASE_URL and SUPABASE_ANON_KEY in the script block.");
            isConfigured = false;
        }

        if (isConfigured) {
             const { createClient } = supabase;
             supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
             // Display a prominent warning if not configured
             document.getElementById('auth-form').innerHTML = `
                 <div class="p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-lg">
                     <p class="font-bold">Configuration Required!</p>
                     <p>Please update the <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> variables in the code.</p>
                 </div>
             `;
        }

        // --- Global State ---
        let currentRole = 'field'; 
        let currentUser = null; 
        let profileListener = null; 
        let currentApprovalTab = 'pending'; 

        // --- DOM Elements ---
        const roleSelect = document.getElementById('role-select');
        const loadingDiv = document.getElementById('loading');
        const fieldDashboard = document.getElementById('field-dashboard');
        const sceDashboard = document.getElementById('sce-dashboard');
        const managerDashboard = document.getElementById('manager-dashboard');
        const adminDashboard = document.getElementById('admin-dashboard');
        const authContainer = document.getElementById('auth-container');
        const contentAreaWrapper = document.getElementById('content-area-wrapper');
        const authControls = document.getElementById('auth-controls');
        const userInfo = document.getElementById('user-info');
        const mainHeader = document.getElementById('main-header'); // NEW REFERENCE
        
        const signInBtn = document.getElementById('signin-btn');
        const signUpBtn = document.getElementById('signup-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authMessage = document.getElementById('auth-message');

        const modal = document.getElementById('notification-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        
        const confirmationModal = document.getElementById('confirmation-modal');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmCancel = document.getElementById('confirm-cancel');
        const confirmProceed = document.getElementById('confirm-proceed');


        // --- Utility Functions ---
        
        function showModal(title, message, isError = false) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (isError) {
                 modalTitle.classList.add('text-red-700');
                 modalTitle.classList.remove('text-gray-800');
            } else {
                 modalTitle.classList.remove('text-red-700');
                 modalTitle.classList.add('text-gray-800');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeModal = function() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            // Reload the dashboard after modal closes to reflect changes
            if (currentUser) loadDashboard(); 
        }
        
        let pendingAction = null;
        function showConfirmation(title, message, onConfirm) {
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            pendingAction = onConfirm;

            confirmProceed.onclick = () => {
                confirmationModal.classList.add('hidden');
                confirmationModal.classList.remove('flex');
                if (pendingAction) {
                    pendingAction();
                }
            };
            confirmCancel.onclick = () => {
                confirmationModal.classList.add('hidden');
                confirmationModal.classList.remove('flex');
                pendingAction = null;
            };

            confirmationModal.classList.remove('hidden');
            confirmationModal.classList.add('flex');
        }

        function getStatusColor(status) {
            switch (status) {
                case 'Submitted': return 'bg-yellow-100 text-yellow-800 border border-yellow-300';
                case 'SCE_Approved': return 'bg-blue-100 text-blue-800 border border-blue-300';
                case 'SCE_Rejected': return 'bg-red-100 text-red-800 border border-red-300';
                case 'Manager_Approved': return 'bg-green-100 text-green-800 border border-green-300';
                case 'Manager_Rejected': return 'bg-red-100 text-red-800 border border-red-300';
                case 'Closed': return 'bg-gray-200 text-gray-700 border border-gray-300';
                case 'Admin_Closed': return 'bg-red-200 text-red-900 border border-red-400';
                default: return 'bg-gray-100 text-gray-600 border border-gray-200';
            }
        }

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            // Check if it's a date-only string (like YYYY-MM-DD)
            if (isoString.length === 10 && isoString.includes('-')) {
                 return new Date(isoString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }
            // Otherwise, treat as datetime
            return new Date(isoString).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }
        
        async function fetchUserRole(userId) {
            if (!supabaseClient) return { role: 'field', name: 'CONFIG_ERROR' };

            const { data, error } = await supabaseClient
                .from('user_profiles')
                .select('role, email') 
                .eq('id', userId)
                .single();

            if (error && error.code !== 'PGRST116') {
                console.warn("Error fetching user profile:", error.message);
            }
            
            return { 
                role: data?.role || 'field',
                name: data?.email || 'N/A (Role fetch failed)' 
            };
        }

        // --- Authentication Functions ---

        function setAuthMessage(message, isError = true) {
            authMessage.textContent = message;
            authMessage.classList.remove('hidden');
            authMessage.classList.toggle('text-red-500', isError);
            authMessage.classList.toggle('text-green-500', !isError);
        }

        async function handleSignUp() {
             if (!isConfigured) return setAuthMessage("System not configured. Update credentials first.", true);
            const email = authEmail.value;
            const password = authPassword.value;
            if (!email || !password) return setAuthMessage("Please enter email and password.");

            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                setAuthMessage(`Sign up error: ${error.message}`);
            } else if (data.user) {
                setAuthMessage("Registration successful! Please check your email for confirmation.", false);
            } else {
                setAuthMessage("Check your email to confirm registration before signing in.", false);
            }
        }

        async function handleSignIn() {
            if (!isConfigured) return setAuthMessage("System not configured. Update credentials first.", true);
            const email = authEmail.value;
            const password = authPassword.value;
            if (!email || !password) return setAuthMessage("Please enter email and password.");

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                setAuthMessage(`Sign in error: ${error.message}`);
            }
        }
        
        async function handleSignOut() {
            if (!isConfigured) return;
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) {
                    console.error("Logout error:", error);
                    showModal('Logout Failed', `There was an issue logging out: ${error.message}`, true);
                } else {
                    console.log("Successfully signed out. UI update triggered by onAuthStateChange.");
                }
            } catch (e) {
                console.error("Critical logout exception:", e);
                showModal('Logout Failed', 'A critical error occurred during logout.', true);
            }
        }


        // --- API Calls (Interacts with RLS) ---

        async function fetchClaims() {
            if (!currentUser || !isConfigured) return []; 
            
            let query = supabaseClient.from('claims').select('*').order('date_raised', { ascending: false });
            
            const { data, error } = await query;
            if (error) {
                console.error(`Error fetching claims as ${currentRole}:`, error);
                return []; 
            }
            return data;
        }

        async function submitClaim(claimData) {
            if (!currentUser || !isConfigured) {
                showModal('Error', 'You must be logged in to submit a claim.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('claims')
                .insert({
                    ...claimData,
                    user_id: currentUser.id,
                    raised_by: currentUser.name, 
                    status: 'Submitted', 
                })
                .select();
            
            if (error) {
                console.error('Error submitting claim:', error);
                showModal('Submission Failed', `There was an error: ${error.message}.`);
            } else {
                showModal('Claim Submitted', `Claim #${data[0].id.substring(0, 8)} has been submitted for SCE approval.`);
            }
        }

        async function updateClaimApproval(claimId, action, notes) {
            if (!currentUser || !isConfigured) {
                showModal('Error', 'You must be logged in to approve/reject claims.');
                return;
            }
            
            let updatePayload = {};
            let newStatus;
            let successMessage;

            if (currentRole === 'sce') {
                newStatus = action === 'approve' ? 'SCE_Approved' : 'SCE_Rejected';
                updatePayload = {
                    status: newStatus,
                    sce_approved: action === 'approve',
                    sce_approver_id: currentUser.id,
                    sce_approval_date: new Date().toISOString(),
                    sce_notes: notes
                };
                successMessage = `Claim #${claimId.substring(0, 8)} was ${action === 'approve' ? 'approved' : 'rejected'} by SCE.`;

            } else if (currentRole === 'manager') {
                newStatus = action === 'approve' ? 'Manager_Approved' : 'Manager_Rejected';
                updatePayload = {
                    status: newStatus,
                    manager_approved: action === 'approve',
                    manager_approver_id: currentUser.id,
                    manager_approval_date: new Date().toISOString(),
                    manager_notes: notes
                };
                successMessage = `Claim #${claimId.substring(0, 8)} was ${action === 'approve' ? 'approved' : 'rejected'} by Manager.`;
            } else {
                showModal('Error', 'Your current role does not have approval privileges.');
                return;
            }

            const { error } = await supabaseClient
                .from('claims')
                .update(updatePayload)
                .eq('id', claimId);

            if (error) {
                console.error('Error updating claim status:', error);
                showModal('Update Failed', `There was an error: ${error.message}. This is usually an RLS violation (wrong status or wrong role).`);
            } else {
                showModal('Approval Updated', successMessage);
            }
        }
        
        window.handleAdminAction = async function(claimId, currentStatus) {
             if (!currentUser || currentUser.role !== 'admin' || !isConfigured) {
                showModal('Error', 'Unauthorized action. Only the authenticated Admin role can perform this.');
                return;
            }

            const isClosed = currentStatus.includes('Closed');
            const newStatus = isClosed ? 'Submitted' : 'Admin_Closed';
            const action = isClosed ? 'Reopen' : 'Close';

            showConfirmation(
                `${action} Claim?`,
                `Are you sure you want to ${action.toLowerCase()} claim ${claimId.substring(0, 8)}? This will set the status to: ${newStatus.replace('_', ' ')}.`,
                async () => {
                    const { error } = await supabaseClient
                        .from('claims')
                        .update({ 
                            status: newStatus,
                            admin_action_date: new Date().toISOString(),
                            admin_action_user: currentUser.name
                        })
                        .eq('id', claimId);
        
                    if (error) {
                        console.error('Error updating claim status:', error);
                        showModal('Update Failed', `There was an error: ${error.message}.`);
                    } else {
                        showModal('Claim Updated', `Claim #${claimId.substring(0, 8)} was successfully ${newStatus.replace('_', ' ').toLowerCase()}.`);
                    }
                }
            );
        }
        
        window.handleApprovalClick = function(claimId, action) {
            const notesElement = document.getElementById(`notes-${claimId}`);
            const notes = notesElement ? notesElement.value : '';
            
            showConfirmation(
                `${action.charAt(0).toUpperCase() + action.slice(1)} Claim?`,
                `Are you sure you want to ${action} claim ${claimId.substring(0, 8)}?`,
                () => {
                    updateClaimApproval(claimId, action, notes);
                }
            );
        }

        // --- Dashboard Rendering ---

        function renderClaimItem(claim, showActions = false, isAdminView = false) {
            const statusClass = getStatusColor(claim.status);
            const isPendingSCE = claim.status === 'Submitted' && currentRole === 'sce';
            const isPendingManager = claim.status === 'SCE_Approved' && currentRole === 'manager';
            const showApprovalButtons = showActions && (isPendingSCE || isPendingManager);
            
            let actionsHtml = '';
            
            if (showApprovalButtons) { 
                actionsHtml = `
                    <div class="mt-4 flex flex-col space-y-3">
                        <textarea id="notes-${claim.id}" class="w-full p-3 border border-gray-300 rounded-xl text-sm shadow-inner transition focus:border-indigo-500" placeholder="Add approval/rejection notes..."></textarea>
                        <div class="flex space-x-3">
                            <button onclick="handleApprovalClick('${claim.id}', 'approve')" class="w-full bg-green-600 text-white font-semibold py-2 rounded-xl hover:bg-green-700 transition shadow-md hover:shadow-lg transform hover:scale-[1.01] flex items-center justify-center space-x-2">
                                <i class="fas fa-check"></i>
                                <span>Approve</span>
                            </button>
                            <button onclick="handleApprovalClick('${claim.id}', 'reject')" class="w-full bg-red-600 text-white font-semibold py-2 rounded-xl hover:bg-red-700 transition shadow-md hover:shadow-lg transform hover:scale-[1.01] flex items-center justify-center space-x-2">
                                <i class="fas fa-times"></i>
                                <span>Reject</span>
                            </button>
                        </div>
                    </div>
                `;
            } else if (isAdminView && currentUser.role === 'admin') { 
                 const actionText = (claim.status === 'Admin_Closed' || claim.status === 'Closed') ? 'Reopen Claim' : 'Close Claim';
                 const buttonColor = (claim.status === 'Admin_Closed' || claim.status === 'Closed') ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-gray-700 hover:bg-gray-800';
                 const iconClass = (claim.status === 'Admin_Closed' || claim.status === 'Closed') ? 'fas fa-undo' : 'fas fa-lock';
                 actionsHtml = `
                    <div class="mt-4">
                        <button onclick="handleAdminAction('${claim.id}', '${claim.status}')" class="w-full ${buttonColor} text-white font-semibold py-2 rounded-xl transition shadow-md hover:shadow-lg transform hover:scale-[1.01] flex items-center justify-center space-x-2">
                            <i class="${iconClass}"></i>
                            <span>${actionText}</span>
                        </button>
                    </div>
                `;
            }
            
            const sceDecision = claim.sce_approval_date ? `<p class="text-sm text-gray-700 mt-1"><span class="font-bold text-blue-700">SCE:</span> <span class="font-medium">${claim.sce_approved ? 'Approved' : 'Rejected'}</span> on ${formatDate(claim.sce_approval_date)}<span class="ml-2 italic text-gray-500">Notes: ${claim.sce_notes || 'N/A'}</span></p>` : '';
            const managerDecision = claim.manager_approval_date ? `<p class="text-sm text-gray-700 mt-1"><span class="font-bold text-green-700">Manager:</span> <span class="font-medium">${claim.manager_approved ? 'Approved' : 'Rejected'}</span> on ${formatDate(claim.manager_approval_date)}<span class="ml-2 italic text-gray-500">Notes: ${claim.manager_notes || 'N/A'}</span></p>` : '';
            const adminAction = claim.admin_action_date ? `<p class="text-sm ${claim.status.includes('Admin') ? 'text-red-700' : 'text-gray-700'} mt-1"><span class="font-bold">Admin Action:</span> Status set to ${claim.status.replace('_', ' ')} on ${formatDate(claim.admin_action_date)}</p>` : '';

            return `
                <div class="bg-gray-50 p-6 border border-gray-200 rounded-xl shadow-inner">
                    <div class="flex justify-between items-start mb-4">
                        <h4 class="text-xl font-bold text-gray-800">${claim.title}</h4>
                        <span class="status-pill ${statusClass}">${claim.status.replace('_', ' ')}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">Claim ID: <code class="font-mono text-xs bg-gray-200 px-1 rounded">${claim.id.substring(0, 8)}</code></p>
                    <p class="text-sm text-gray-600 mb-3 border-b pb-2">Raised By: <span class="font-semibold text-indigo-600">${claim.raised_by}</span></p>
                    
                    <div class="mt-4 p-4 bg-white rounded-xl space-y-2 border border-indigo-200 shadow-sm">
                        <p class="text-sm text-gray-700"><span class="font-semibold text-gray-900">Customer:</span> ${claim.customer_name || 'N/A'}</p>
                        <p class="text-sm text-gray-700"><span class="font-semibold text-gray-900">Equipment:</span> ${claim.machine_model || 'N/A'} / S/N: ${claim.equipment_serial}</p>
                        <p class="text-sm text-gray-700"><span class="font-semibold text-gray-900">Hours:</span> ${claim.running_hour || 'N/A'}</p>
                        <p class="text-sm text-gray-700"><span class="font-semibold text-gray-900">Failure:</span> ${claim.failure_component || 'N/A'} (Part No: ${claim.failure_part_no || 'N/A'})</p>
                        <p class="text-sm text-gray-700"><span class="font-semibold text-gray-900">Date:</span> ${formatDate(claim.failure_date) || 'N/A'}</p>
                    </div>

                    <p class="text-base text-gray-800 mt-4 mb-4 whitespace-pre-wrap leading-relaxed border-l-4 pl-3 border-gray-200">${claim.description}</p>
                    
                    <div class="mt-4 pt-3 border-t border-gray-200 space-y-2">
                        ${sceDecision}
                        ${managerDecision}
                        ${adminAction}
                    </div>
                    ${actionsHtml}
                </div>
            `;
        }

        function renderFieldDashboard(claims) {
            fieldDashboard.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 p-4">
                    <div class="lg:col-span-1 bg-white p-6 border border-indigo-100 rounded-2xl shadow-lg h-fit">
                        <h2 class="text-2xl font-bold text-indigo-700 mb-4">New Warranty Claim</h2>
                        <form id="new-claim-form" class="space-y-4">
                            <h3 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2">Customer & Machine</h3>
                            <div>
                                <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                                <input type="text" id="customer-name" required class="input-field">
                            </div>
                            <div>
                                <label for="machine-model" class="block text-sm font-medium text-gray-700">Machine Model</label>
                                <input type="text" id="machine-model" required class="input-field">
                            </div>
                            <div>
                                <label for="claim-serial" class="block text-sm font-medium text-gray-700">Serial Number</label>
                                <input type="text" id="claim-serial" required class="input-field">
                            </div>
                            <div>
                                <label for="running-hour" class="block text-sm font-medium text-gray-700">Running Hours (Approx)</label>
                                <input type="number" id="running-hour" class="input-field" step="1" min="0" placeholder="e.g., 5000">
                            </div>

                            <h3 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2 pt-2">Failure Information</h3>
                            <div>
                                <label for="failure-date" class="block text-sm font-medium text-gray-700">Failure Date</label>
                                <input type="date" id="failure-date" required class="input-field">
                            </div>
                            <div>
                                <label for="failure-component" class="block text-sm font-medium text-gray-700">Failure Component</label>
                                <input type="text" id="failure-component" required class="input-field" placeholder="e.g., Hydraulic Pump, Engine Belt">
                            </div>
                            <div>
                                <label for="failure-part-no" class="block text-sm font-medium text-gray-700">Part No. of Failure Component</label>
                                <input type="text" id="failure-part-no" class="input-field" placeholder="Optional">
                            </div>
                            
                            <h3 class="text-lg font-semibold text-gray-700 border-b pb-1 mb-2 pt-2">Problem Description</h3>
                            <div>
                                <label for="claim-title" class="block text-sm font-medium text-gray-700">Claim Summary / Problem</label>
                                <input type="text" id="claim-title" required class="input-field" placeholder="Short summary of the issue">
                            </div>
                            <div>
                                <label for="claim-description" class="block text-sm font-medium text-gray-700">Detailed Description of Fault</label>
                                <textarea id="claim-description" rows="4" required class="input-field"></textarea>
                            </div>

                            <button type="submit" class="w-full btn-primary py-3 rounded-xl font-bold flex items-center justify-center space-x-2">
                                <i class="fas fa-paper-plane"></i>
                                <span>Submit Claim</span>
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 p-4">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">My Submitted Claims (${claims.length})</h2>
                        <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-indigo-400 bg-indigo-50 py-2">Data displayed here is filtered by the backend security policies. You only see claims you raised.</p>
                        <div class="space-y-4">
                            ${claims.length > 0 ? claims.map(c => renderClaimItem(c)).join('') : '<p class="text-gray-500 p-4 bg-white rounded-lg shadow-sm">No claims submitted yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('new-claim-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // New Fields
                const customerName = document.getElementById('customer-name').value;
                const machineModel = document.getElementById('machine-model').value;
                const runningHour = document.getElementById('running-hour').value;
                const failureDate = document.getElementById('failure-date').value;
                const failureComponent = document.getElementById('failure-component').value;
                const failurePartNo = document.getElementById('failure-part-no').value;

                // Existing Fields
                const title = document.getElementById('claim-title').value;
                const serial = document.getElementById('claim-serial').value;
                const description = document.getElementById('claim-description').value;

                const claimPayload = { 
                    title: title, 
                    equipment_serial: serial, 
                    description: description,
                    customer_name: customerName,
                    machine_model: machineModel,
                    running_hour: runningHour ? parseFloat(runningHour) : null,
                    failure_date: failureDate,
                    failure_component: failureComponent,
                    failure_part_no: failurePartNo
                };

                await submitClaim(claimPayload);
                e.target.reset();
            });
        }

        function renderApprovalDashboard(claims, title, targetDiv) {
            targetDiv.innerHTML = `
                <div class="bg-white p-6 border border-gray-100 rounded-xl shadow-lg m-4">
                    <h2 class="text-3xl font-bold text-indigo-700 mb-6">${title} (${claims.length})</h2>
                    <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-indigo-400 bg-indigo-50 py-2">Data displayed here is filtered by the backend security policies. You only see claims ready for your specific approval stage.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${claims.length > 0 ? claims.map(c => renderClaimItem(c, true)).join('') : '<p class="text-gray-500">No claims currently pending approval.</p>'}
                    </div>
                </div>
            `;
        }
        
        function renderAdminDashboard(claims) {
            adminDashboard.innerHTML = `
                <div class="bg-white p-6 border border-gray-100 rounded-xl shadow-lg m-4">
                    <h2 class="text-3xl font-bold text-red-700 mb-6">Admin Master View (All Claims: ${claims.length})</h2>
                    <p class="text-sm text-gray-500 mb-4 border-l-2 pl-3 border-red-400 bg-red-50 py-2">As **Admin**, you bypass all RLS filters and see all claims in the database. Use this view for auditing and manual state control.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${claims.length > 0 ? claims.map(c => renderClaimItem(c, false, true)).join('') : '<p class="text-gray-500">No claims found in the database.</p>'}
                    </div>
                </div>
            `;
        }


        // --- Main Controller ---

        function switchDashboard(role) {
            // Hide all
            fieldDashboard.classList.add('hidden');
            sceDashboard.classList.add('hidden');
            managerDashboard.classList.add('hidden');
            adminDashboard.classList.add('hidden');

            currentRole = role;

            // Show current one
            if (role === 'field') {
                fieldDashboard.classList.remove('hidden');
            } else if (role === 'sce') {
                sceDashboard.classList.remove('hidden');
            } else if (role === 'manager') {
                managerDashboard.classList.remove('hidden');
            } else if (role === 'admin') { 
                adminDashboard.classList.remove('hidden');
            }
            
            loadDashboard();
        }

        async function loadDashboard() {
            if (!currentUser) return;

            loadingDiv.classList.remove('hidden');
            
            const claims = await fetchClaims();
            
            loadingDiv.classList.add('hidden');

            if (currentRole === 'field') {
                renderFieldDashboard(claims);
            } else if (currentRole === 'sce') {
                // SCE sees 'Submitted' claims
                const pendingClaims = claims.filter(c => c.status === 'Submitted');
                renderApprovalDashboard(pendingClaims, 'Claims Pending SCE Approval', sceDashboard);
            } else if (currentRole === 'manager') {
                // Manager sees 'SCE_Approved' claims
                const pendingClaims = claims.filter(c => c.status === 'SCE_Approved');
                renderApprovalDashboard(pendingClaims, 'Claims Pending Manager Approval', managerDashboard);
            } else if (currentRole === 'admin') {
                renderAdminDashboard(claims);
            }
        }
        
        function refreshDashboardFromPayload(newProfileData) {
            const newRole = newProfileData.role;
            const newName = newProfileData.email;
            
            if (currentUser.role === newRole) {
                console.log(`Role is already ${newRole}. No change needed from Realtime payload.`);
                return;
            }

            currentUser.role = newRole;
            currentUser.name = newName;
            currentRole = newRole;

            userInfo.textContent = `User: ${currentUser.name} (Role: ${currentUser.role})`;
            
            roleSelect.value = currentRole;
            roleSelect.disabled = (currentRole !== 'admin');
            roleSelect.title = (currentRole !== 'admin') ? `Access restricted to ${currentRole} view.` : `Admin can view all roles.`;

            switchDashboard(currentRole);
            showModal("Role Updated", `Your role has been updated to **${newRole}**. The dashboard has been refreshed.`);
        }
        
        function startRoleListener(userId) {
            if (profileListener) {
                supabaseClient.removeChannel(profileListener);
            }
            
            profileListener = supabaseClient
                .channel('roles_channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user_profiles' }, async (payload) => {
                    if (currentUser && payload.new.id === userId) {
                         refreshDashboardFromPayload(payload.new);
                    }
                })
                .subscribe();
        }

        function stopRoleListener() {
            if (profileListener) {
                supabaseClient.removeChannel(profileListener);
                profileListener = null;
            }
        }

        async function updateUI(session) {
            if (session) {
                // Logged In State
                startRoleListener(session.user.id);
                
                authContainer.classList.add('hidden');
                contentAreaWrapper.classList.remove('hidden');
                authControls.classList.remove('hidden');
                mainHeader.classList.remove('hidden'); // SHOW HEADER

                // Set body style for dashboard view
                document.body.classList.remove('justify-center', 'items-center');
                document.body.style.backgroundColor = '#f3f4f6'; // Dashboard background

                const { role, name } = await fetchUserRole(session.user.id);
                
                currentUser = { id: session.user.id, name: name, role: role };
                
                userInfo.textContent = `User: ${currentUser.name} (Role: ${currentUser.role})`;
                
                roleSelect.value = currentUser.role;
                currentRole = currentUser.role;
                
                roleSelect.disabled = (currentUser.role !== 'admin');
                if (currentUser.role !== 'admin') {
                    roleSelect.title = `Access restricted to ${currentUser.role} view.`;
                } else {
                     roleSelect.title = `Admin can view all roles.`;
                }
                
                switchDashboard(currentRole);

            } else {
                // Logged Out State
                stopRoleListener(); 
                currentUser = null;
                currentRole = 'field'; 
                
                authContainer.classList.remove('hidden');
                contentAreaWrapper.classList.add('hidden');
                authControls.classList.add('hidden');
                mainHeader.classList.add('hidden'); // HIDE HEADER

                // Set body style for login view
                document.body.classList.add('justify-center', 'items-center');
                document.body.style.backgroundColor = '#1e293b'; // Login background

                authMessage.classList.add('hidden');
                authEmail.value = '';
                authPassword.value = '';
            }
        }

        // --- Initialization ---
        
        signInBtn.addEventListener('click', handleSignIn);
        signUpBtn.addEventListener('click', handleSignUp);
        logoutBtn.addEventListener('click', handleSignOut);

        roleSelect.addEventListener('change', (e) => {
            if (currentUser && currentUser.role === 'admin') {
                switchDashboard(e.target.value);
            } else {
                e.target.value = currentUser.role;
            }
        });
        
        if (isConfigured) {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                updateUI(session);
            });
            
            supabaseClient
                .channel('claims_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'claims' }, (payload) => {
                    if (currentUser) {
                         loadDashboard();
                    }
                })
                .subscribe();
        } 
    </script>
</body>
</html>
