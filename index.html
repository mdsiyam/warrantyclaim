<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claims Management Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons for aesthetic buttons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- Header and User Info -->
    <header class="mb-8 p-4 bg-white shadow-xl rounded-xl">
        <h1 class="text-3xl font-extrabold text-gray-800">Claims Approval System</h1>
        <div id="user-info" class="mt-2 text-sm text-gray-600">Loading user data...</div>
    </header>

    <!-- Global Message/Status Box -->
    <div id="message-box" class="fixed top-4 right-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="bg-indigo-600 text-white px-4 py-3 rounded-lg shadow-2xl font-semibold"></div>
    </div>

    <!-- Main Content Area -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Panel: Claim List (All Roles) -->
        <div class="lg:col-span-2">
            <h2 id="dashboard-title" class="text-2xl font-bold text-gray-700 mb-4">Your Claims</h2>
            <div id="claims-list" class="space-y-4">
                <p class="text-gray-500" id="loading-indicator">Fetching claims...</p>
            </div>
        </div>

        <!-- Right Panel: Claim Actions (SCE & Manager) -->
        <div class="lg:col-span-1 sticky top-8">
            <div id="action-panel" class="bg-white p-6 rounded-xl shadow-xl border border-indigo-100 hidden">
                <h3 class="text-xl font-bold mb-4 text-indigo-700" id="action-header"></h3>
                
                <!-- Claim Summary -->
                <div class="mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="text-sm font-medium text-gray-600">Claim ID: <span id="current-claim-id" class="font-mono text-xs text-gray-800"></span></p>
                    <p class="text-lg font-semibold" id="current-claim-title"></p>
                    <p class="text-sm text-gray-500" id="current-claim-status"></p>
                </div>
                
                <!-- SCE Approval Area (Hidden unless SCE) -->
                <div id="sce-action-area" class="hidden">
                    <label for="sce-notes" class="block text-sm font-medium text-gray-700 mb-2">SCE Notes (Required for Decision)</label>
                    <textarea id="sce-notes" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    <div class="flex space-x-4 mt-4">
                        <button onclick="handleSceDecision('SCE_Approved')" 
                            class="flex-1 px-4 py-3 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                            <span data-lucide="check" class="inline-block w-5 h-5 mr-1"></span> Approve (to Manager)
                        </button>
                        <button onclick="handleSceDecision('SCE_Rejected')" 
                            class="flex-1 px-4 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                            <span data-lucide="x" class="inline-block w-5 h-5 mr-1"></span> Reject
                        </button>
                    </div>
                </div>

                <!-- MANAGER Approval Area (Hidden unless Manager) -->
                <div id="manager-action-area" class="hidden">
                    <div id="sce-review-display" class="mb-4 p-3 bg-indigo-50 rounded-lg border border-indigo-200">
                        <p class="font-semibold text-indigo-700">SCE Review:</p>
                        <p class="text-sm text-gray-700 mt-1" id="sce-notes-display"></p>
                    </div>
                    
                    <label for="manager-notes" class="block text-sm font-medium text-gray-700 mb-2">Manager Notes (Final Decision)</label>
                    <textarea id="manager-notes" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    <div class="flex space-x-4 mt-4">
                        <button onclick="handleManagerDecision('Approved')" 
                            class="flex-1 px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-150">
                            <span data-lucide="send" class="inline-block w-5 h-5 mr-1"></span> Final Approve
                        </button>
                        <button onclick="handleManagerDecision('Rejected')" 
                            class="flex-1 px-4 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150">
                            <span data-lucide="flag" class="inline-block w-5 h-5 mr-1"></span> Final Reject
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Set log level to Debug for visibility into RLS issues
        setLogLevel('Debug');

        // --- GLOBAL STATE & CONFIGURATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth;
        let currentUserRole = 'guest';
        let currentUserId = null;
        let selectedClaim = null;
        
        const claimListEl = document.getElementById('claims-list');
        const actionPanelEl = document.getElementById('action-panel');
        const sceActionAreaEl = document.getElementById('sce-action-area');
        const managerActionAreaEl = document.getElementById('manager-action-area');
        const dashboardTitleEl = document.getElementById('dashboard-title');
        const loadingIndicatorEl = document.getElementById('loading-indicator');

        // --- UTILITY FUNCTIONS ---

        /** Shows a temporary message banner. */
        function showMessage(message, isError = false) {
            const box = document.getElementById('message-box');
            const content = box.querySelector('div');
            
            content.textContent = message;
            box.classList.remove('opacity-0', 'pointer-events-none', 'bg-red-600', 'bg-indigo-600');
            box.classList.add(isError ? 'bg-red-600' : 'bg-indigo-600');
            box.classList.add('opacity-100', 'pointer-events-auto');

            setTimeout(() => {
                box.classList.remove('opacity-100', 'pointer-events-auto');
                box.classList.add('opacity-0', 'pointer-events-none');
            }, 5000);
        }

        /** Formats the status for display. */
        function formatStatus(status) {
            let color = 'bg-gray-200 text-gray-700';
            if (status === 'Submitted') color = 'bg-yellow-100 text-yellow-800';
            if (status === 'SCE_Approved') color = 'bg-blue-100 text-blue-800';
            if (status === 'Approved') color = 'bg-green-100 text-green-800';
            if (status.includes('Rejected')) color = 'bg-red-100 text-red-800';
            
            return `<span class="inline-block px-3 py-1 text-xs font-semibold rounded-full ${color}">${status}</span>`;
        }
        
        /** Selects a claim and updates the action panel. */
        window.selectClaim = (claim) => {
            selectedClaim = claim;
            
            document.getElementById('current-claim-id').textContent = claim.id.substring(0, 8) + '...';
            document.getElementById('current-claim-title').textContent = claim.title;
            document.getElementById('current-claim-status').innerHTML = formatStatus(claim.status);
            
            actionPanelEl.classList.remove('hidden');
            sceActionAreaEl.classList.add('hidden');
            managerActionAreaEl.classList.add('hidden');

            if (currentUserRole === 'sce' && claim.status === 'Submitted') {
                document.getElementById('action-header').textContent = 'SCE Decision';
                sceActionAreaEl.classList.remove('hidden');
                document.getElementById('sce-notes').value = claim.sce_notes || '';
            } else if (currentUserRole === 'manager' && claim.status === 'SCE_Approved') {
                document.getElementById('action-header').textContent = 'Manager Final Decision';
                managerActionAreaEl.classList.remove('hidden');
                document.getElementById('manager-notes').value = claim.manager_notes || '';
                
                // Display SCE Notes
                document.getElementById('sce-notes-display').textContent = claim.sce_notes || 'No notes provided by SCE.';
            } else {
                 document.getElementById('action-header').textContent = 'Claim Details';
                 actionPanelEl.classList.add('hidden'); // Hide if not actionable
            }

            // Ensure icon rendering is complete
            lucide.createIcons();
        }

        /** Renders the list of claims based on role-specific query results. */
        function renderClaims(claims) {
            claimListEl.innerHTML = '';
            loadingIndicatorEl.classList.add('hidden');

            if (claims.length === 0) {
                claimListEl.innerHTML = `<p class="text-gray-500 p-4 bg-white rounded-lg shadow-md">No claims found for your current role and status filters.</p>`;
                return;
            }

            claims.forEach(claim => {
                const el = document.createElement('div');
                el.className = 'bg-white p-4 rounded-xl shadow-md border border-gray-200 hover:shadow-lg transition cursor-pointer';
                el.onclick = () => selectClaim(claim);

                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="text-lg font-semibold text-gray-800 truncate">${claim.title}</h4>
                        ${formatStatus(claim.status)}
                    </div>
                    <p class="text-sm text-gray-500 mt-1">Raised by: ${claim.raised_by || 'Unknown'}</p>
                    <p class="text-sm text-gray-400">Raised on: ${new Date(claim.date_raised).toLocaleDateString()}</p>
                `;
                claimListEl.appendChild(el);
            });
        }


        // --- FIREBASE INITIALIZATION AND AUTH ---

        async function initializeFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Sign in using the custom token or anonymously if not available
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                // Set up auth state change listener to determine role and start data fetch
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        // Fetch the user's role from the 'user_profiles' collection
                        const userDocRef = doc(db, "user_profiles", user.uid);
                        const roleSnapshot = await onSnapshot(userDocRef, (docSnap) => {
                            if (docSnap.exists() && docSnap.data().role) {
                                currentUserRole = docSnap.data().role;
                                document.getElementById('user-info').innerHTML = `Logged in as: <span class="font-bold text-indigo-700">${user.email}</span> | Role: <span class="font-bold uppercase">${currentUserRole}</span> | User ID: <span class="text-xs font-mono">${currentUserId.substring(0, 8)}...</span>`;
                                
                                startRoleSpecificQuery();
                            } else {
                                showMessage("User profile not found. Please check 'user_profiles' table.", true);
                            }
                        });

                    } else {
                        showMessage("Not authenticated. Please refresh to attempt auto-login.", true);
                    }
                });

            } catch (error) {
                console.error("Firebase Initialization or Auth Error:", error);
                showMessage(`Initialization Failed: ${error.message}`, true);
            }
        }


        // --- DATA FETCHING (Role-Specific Queries) ---

        function startRoleSpecificQuery() {
            let claimsQuery;
            let title = 'Your Claims';
            const claimsCollection = collection(db, `artifacts/${appId}/public/data/claims`);

            // Apply RLS-matching filters based on the user's determined role
            switch (currentUserRole) {
                case 'field':
                    // Policy 3: Field user can only view their own claims (raised_by is user-friendly name, but should be filtered by user_id or similar if strictly adhering to RLS, but here we use RLS to handle it and just fetch all)
                    // We'll trust RLS to filter this, but fetching all public data can be noisy. Since RLS handles the filter, we just query the collection.
                    claimsQuery = query(claimsCollection);
                    break;
                case 'sce':
                    // Policy 5: SCE views claims in 'Submitted' status
                    title = 'SCE Dashboard: Claims Awaiting Your Review';
                    claimsQuery = query(claimsCollection, where('status', '==', 'Submitted'));
                    break;
                case 'manager':
                    // Policy 7: Manager views claims in 'SCE_Approved' status
                    title = 'Manager Dashboard: Final Approval Stage';
                    claimsQuery = query(claimsCollection, where('status', '==', 'SCE_Approved'));
                    break;
                case 'admin':
                    title = 'Admin Dashboard: ALL Claims';
                    claimsQuery = query(claimsCollection);
                    break;
                default:
                    title = 'Guest View';
                    claimsQuery = null; // No query for guests
            }
            
            dashboardTitleEl.textContent = title;
            loadingIndicatorEl.classList.remove('hidden');

            if (claimsQuery) {
                onSnapshot(claimsQuery, (snapshot) => {
                    const claims = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderClaims(claims);
                    loadingIndicatorEl.classList.add('hidden');
                    
                    // Clear action panel if the selected claim is no longer visible/actionable
                    if (selectedClaim && !claims.some(c => c.id === selectedClaim.id)) {
                        actionPanelEl.classList.add('hidden');
                        selectedClaim = null;
                    }
                }, (error) => {
                    console.error("Error fetching claims:", error);
                    showMessage(`Error fetching data: ${error.message}`, true);
                });
            } else {
                renderClaims([]);
            }
            
            lucide.createIcons();
        }

        // --- UPDATE HANDLERS ---

        /** Handles decision for SCE role (Policy 6A). */
        window.handleSceDecision = async (newStatus) => {
            if (!selectedClaim || currentUserRole !== 'sce') return;
            const notes = document.getElementById('sce-notes').value;
            
            if (!notes) {
                showMessage("SCE Notes are required to make a decision.", true);
                return;
            }

            try {
                const claimRef = doc(db, `artifacts/${appId}/public/data/claims`, selectedClaim.id);
                
                const updatePayload = {
                    status: newStatus,
                    sce_approved: newStatus === 'SCE_Approved',
                    sce_approver_id: currentUserId,
                    sce_approval_date: new Date(),
                    sce_notes: notes,
                };
                
                await updateDoc(claimRef, updatePayload);
                showMessage(`Claim ${selectedClaim.id.substring(0, 8)} updated to ${newStatus}.`);

            } catch (error) {
                console.error("SCE Update Failed:", error);
                showMessage(`Update Failed: ${error.message}`, true);
            }
        };

        /** Handles decision for Manager role (Policy 8A). */
        window.handleManagerDecision = async (newStatus) => {
            if (!selectedClaim || currentUserRole !== 'manager') return;
            const notes = document.getElementById('manager-notes').value;
            
            if (!notes) {
                showMessage("Manager Notes are required for the final decision.", true);
                return;
            }

            try {
                const claimRef = doc(db, `artifacts/${appId}/public/data/claims`, selectedClaim.id);
                
                // IMPORTANT: The payload must only contain fields allowed by Policy 8A.
                const updatePayload = {
                    status: newStatus,
                    manager_approved: newStatus === 'Approved',
                    manager_approver_id: currentUserId,
                    manager_approval_date: new Date(),
                    manager_notes: notes,
                };
                
                await updateDoc(claimRef, updatePayload);
                showMessage(`Claim ${selectedClaim.id.substring(0, 8)} finalized as ${newStatus}.`);

            } catch (error) {
                console.error("Manager Update Failed:", error);
                showMessage(`Update Failed: ${error.message}. This is usually an RLS violation (wrong status or wrong role).`, true);
            }
        };


        // --- START APPLICATION ---
        window.onload = initializeFirebase;
    </script>
</body>
</html>
