<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warranty Approval System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05); }
    .status-pill { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body class="p-4 sm:p-8">

<div id="app" class="max-w-7xl mx-auto">

  <!-- ========== AUTH AREA ========== -->
  <div id="auth-container" class="mb-6">
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4">Login</h2>
      <input id="auth-email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-2">
      <input id="auth-password" type="password" placeholder="Password" class="w-full p-2 border rounded mb-2">
      <select id="role-select" class="w-full p-2 border rounded mb-2">
        <option value="field">Field</option>
        <option value="sce">SCE</option>
        <option value="manager">Manager</option>
        <option value="admin">Admin</option>
      </select>
      <button id="signin-btn" class="bg-indigo-600 text-white px-4 py-2 rounded">Sign In</button>
    </div>
  </div>

  <!-- ========== DASHBOARDS ========== -->
  <div id="content-area" class="hidden">
    <div id="field-dashboard" class="hidden"></div>
    <div id="sce-dashboard" class="hidden"></div>
    <div id="manager-dashboard" class="hidden"></div>
    <div id="admin-dashboard" class="hidden"></div>
  </div>

  <!-- ========== MODALS ========== -->
  <div id="notification-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded-lg max-w-sm">
      <h3 id="modal-title" class="font-bold mb-2">Title</h3>
      <p id="modal-message" class="mb-4">Message</p>
      <button onclick="closeModal()" class="bg-indigo-600 text-white px-4 py-2 rounded">OK</button>
    </div>
  </div>

  <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded-lg max-w-sm">
      <h3 id="confirm-title" class="font-bold mb-2">Confirm</h3>
      <p id="confirm-message" class="mb-4">Are you sure?</p>
      <div class="flex justify-end space-x-2">
        <button id="confirm-cancel" class="bg-gray-400 text-white px-4 py-2 rounded">Cancel</button>
        <button id="confirm-proceed" class="bg-green-600 text-white px-4 py-2 rounded">Proceed</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentRole = "field";

  const roleSelect = document.getElementById("role-select");
  const authContainer = document.getElementById("auth-container");
  const contentArea = document.getElementById("content-area");
  const modal = document.getElementById("notification-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalMessage = document.getElementById("modal-message");

  const confirmationModal = document.getElementById("confirmation-modal");
  const confirmTitle = document.getElementById("confirm-title");
  const confirmMessage = document.getElementById("confirm-message");
  const confirmCancel = document.getElementById("confirm-cancel");
  const confirmProceed = document.getElementById("confirm-proceed");

  function showModal(title, message) {
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }

  window.closeModal = function () {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    loadDashboard();
  };

  let pendingAction = null;
  function showConfirmation(title, message, onConfirm) {
    confirmTitle.textContent = title;
    confirmMessage.textContent = message;
    pendingAction = onConfirm;
    confirmProceed.onclick = () => {
      confirmationModal.classList.add("hidden");
      confirmationModal.classList.remove("flex");
      if (pendingAction) pendingAction();
    };
    confirmCancel.onclick = () => {
      confirmationModal.classList.add("hidden");
      confirmationModal.classList.remove("flex");
      pendingAction = null;
    };
    confirmationModal.classList.remove("hidden");
    confirmationModal.classList.add("flex");
  }

  function getStatusColor(status) {
    switch (status) {
      case "Submitted": return "bg-yellow-100 text-yellow-800";
      case "SCE_Approved": return "bg-blue-100 text-blue-800";
      case "SCE_Rejected": return "bg-red-100 text-red-800";
      case "Manager_Approved": return "bg-green-100 text-green-800";
      case "Manager_Rejected": return "bg-red-100 text-red-800";
      case "Closed": return "bg-gray-200 text-gray-700";
      default: return "bg-gray-100 text-gray-600";
    }
  }

  async function fetchClaims() {
    const { data, error } = await supabaseClient.from("claims").select("*").order("date_raised", { ascending: false });
    return data || [];
  }

  // SCE or Manager update via table update
  async function updateClaimApproval(claimId, action, notes) {
    let updatePayload = {}, newStatus;
    if (currentRole === "sce") {
      newStatus = action === "approve" ? "SCE_Approved" : "SCE_Rejected";
      updatePayload = { status: newStatus, sce_approved: action === "approve", sce_approver_id: currentUser.id, sce_approval_date: new Date().toISOString(), sce_notes: notes };
    } else if (currentRole === "manager") {
      newStatus = action === "approve" ? "Manager_Approved" : "Manager_Rejected";
      updatePayload = { status: newStatus, manager_approved: action === "approve", manager_approver_id: currentUser.id, manager_approval_date: new Date().toISOString(), manager_notes: notes };
    }
    const { error } = await supabaseClient.from("claims").update(updatePayload).eq("id", claimId);
    if (error) showModal("Update Failed", error.message);
    else showModal("Updated", `Claim updated to ${newStatus}`);
  }

  // NEW: RPC based manager approval
  async function updateClaimManagerApproval(claimId, action, notes) {
    const { error } = await supabaseClient.rpc("approve_claim_manager", {
      claim_id: claimId,
      approve: action === "approve",
      notes: notes,
      user_id: currentUser.id
    });
    if (error) showModal("Update Failed", error.message);
    else showModal("Manager Approval", `Manager ${action}d claim`);
  }

  window.handleApprovalClick = function (claimId, action) {
    const notes = document.getElementById(`notes-${claimId}`)?.value || "";
    showConfirmation("Confirm", `Proceed with ${action}?`, () => updateClaimApproval(claimId, action, notes));
  };

  function renderClaimItem(claim) {
    const statusClass = getStatusColor(claim.status);
    let actionsHtml = "";

    // SCE actions
    if (currentRole === "sce" && claim.status === "Submitted") {
      actionsHtml = `
        <textarea id="notes-${claim.id}" class="w-full p-2 border rounded text-sm" placeholder="Add notes"></textarea>
        <div class="flex space-x-2 mt-2">
          <button onclick="handleApprovalClick('${claim.id}','approve')" class="bg-green-600 text-white px-4 py-2 rounded">Approve</button>
          <button onclick="handleApprovalClick('${claim.id}','reject')" class="bg-red-600 text-white px-4 py-2 rounded">Reject</button>
        </div>`;
    }

    // Manager actions via RPC
    if (currentRole === "manager" && claim.status === "SCE_Approved") {
      actionsHtml = `
        <textarea id="manager-notes-${claim.id}" class="w-full p-2 border rounded text-sm" placeholder="Manager notes"></textarea>
        <div class="flex space-x-2 mt-2">
          <button onclick="updateClaimManagerApproval('${claim.id}','approve',document.getElementById('manager-notes-${claim.id}').value)" class="bg-green-700 text-white px-4 py-2 rounded">Approve (Manager)</button>
          <button onclick="updateClaimManagerApproval('${claim.id}','reject',document.getElementById('manager-notes-${claim.id}').value)" class="bg-red-700 text-white px-4 py-2 rounded">Reject (Manager)</button>
        </div>`;
    }

    return `
      <div class="card bg-white p-4 mb-3 rounded shadow">
        <div class="flex justify-between">
          <span class="font-semibold">${claim.title || "Claim"}</span>
          <span class="status-pill ${statusClass}">${claim.status}</span>
        </div>
        <p class="text-sm text-gray-500">ID: ${claim.id}</p>
        ${actionsHtml}
      </div>`;
  }

  async function loadDashboard() {
    authContainer.classList.add("hidden");
    contentArea.classList.remove("hidden");

    const claims = await fetchClaims();

    document.getElementById("field-dashboard").classList.add("hidden");
    document.getElementById("sce-dashboard").classList.add("hidden");
    document.getElementById("manager-dashboard").classList.add("hidden");
    document.getElementById("admin-dashboard").classList.add("hidden");

    let container;
    if (currentRole === "field") container = document.getElementById("field-dashboard");
    else if (currentRole === "sce") container = document.getElementById("sce-dashboard");
    else if (currentRole === "manager") container = document.getElementById("manager-dashboard");
    else container = document.getElementById("admin-dashboard");

    container.classList.remove("hidden");
    container.innerHTML = claims.map(c => renderClaimItem(c)).join("");
  }

  // Fake sign in just to test
  document.getElementById("signin-btn").onclick = () => {
    currentRole = roleSelect.value;
    currentUser = { id: crypto.randomUUID(), role: currentRole, name: "Demo User" };
    loadDashboard();
  };
</script>
</body>
</html>
