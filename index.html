<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Warranty Approval System</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, button { margin: 5px; padding: 6px; }
    textarea { width: 100%; height: 80px; }
    .hidden { display: none; }
    .card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Warranty Approval System</h2>

  <!-- Login -->
  <div id="login-section">
    <h3>Login</h3>
    <input id="email" type="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>

  <!-- Logout -->
  <div id="logout-section" class="hidden">
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Claim Form (only for field users) -->
  <div id="claim-form" class="hidden">
    <h3>Submit Warranty Claim (Field User)</h3>
    <input id="customer_name" placeholder="Customer Name"><br>
    <input id="machine_model" placeholder="Machine Model"><br>
    <input id="serial_no" placeholder="Serial No"><br>
    <input id="running_hour" placeholder="Running Hours" type="number"><br>
    <input id="failure_date" type="date"><br>
    <input id="failure_component" placeholder="Failure Component"><br>
    <input id="part_no" placeholder="Part No"><br>
    <input id="problem_summary" placeholder="Problem Summary"><br>
    <textarea id="problem_description" placeholder="Problem Description"></textarea><br>
    <button onclick="submitClaim()">Submit Claim</button>
  </div>

  <!-- Claims List -->
  <div id="claims-list" class="hidden">
    <h3>Claims</h3>
    <div id="claims"></div>
  </div>

<script>
  const SUPABASE_URL = "https://vbxnkdwdbowvxuozsroh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZieG5rZHdkYm93dnh1b3pzcm9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMjIwODgsImV4cCI6MjA3NDY5ODA4OH0._j9jY5wgNKbXUu2ZMpOx_kx7EVYU99Hi5TYsXR34g9g";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let currentRole = null;

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { alert("Login error: " + error.message); return; }

    currentUser = data.user;

    // 🔹 fetch profile by id
    let { data: profile } = await supabase
      .from("profiles")
      .select("id,email,role")
      .eq("id", currentUser.id)
      .maybeSingle();

    // if not found, try by email
    if (!profile) {
      const { data: byEmail } = await supabase
        .from("profiles")
        .select("id,email,role")
        .eq("email", currentUser.email)
        .maybeSingle();
      profile = byEmail;
    }

    // if still missing, insert default field profile
    if (!profile) {
      const { data: inserted, error: insertError } = await supabase
        .from("profiles")
        .insert([{ id: currentUser.id, email: currentUser.email, role: "field" }])
        .select()
        .maybeSingle();
      if (insertError) { alert("Error creating profile: " + insertError.message); return; }
      profile = inserted;
    }

    if (!profile || !profile.role) {
      alert("No role found even after insert. Please check DB.");
      return;
    }

    currentRole = profile.role;
    alert("Logged in as: " + currentRole);

    document.getElementById("login-section").classList.add("hidden");
    document.getElementById("logout-section").classList.remove("hidden");

    if (currentRole === "field") document.getElementById("claim-form").classList.remove("hidden");
    document.getElementById("claims-list").classList.remove("hidden");

    loadClaims();
  }

  async function logout() {
    await supabase.auth.signOut();
    currentUser = null;
    currentRole = null;
    document.getElementById("login-section").classList.remove("hidden");
    document.getElementById("claim-form").classList.add("hidden");
    document.getElementById("claims-list").classList.add("hidden");
    document.getElementById("logout-section").classList.add("hidden");
    alert("Logged out successfully!");
  }

  async function submitClaim() {
    if (currentRole !== "field") return;

    const claim = {
      customer_name: document.getElementById("customer_name").value,
      machine_model: document.getElementById("machine_model").value,
      serial_no: document.getElementById("serial_no").value,
      running_hour: parseInt(document.getElementById("running_hour").value),
      failure_date: document.getElementById("failure_date").value,
      failure_component: document.getElementById("failure_component").value,
      part_no: document.getElementById("part_no").value,
      problem_summary: document.getElementById("problem_summary").value,
      problem_description: document.getElementById("problem_description").value,
      user_id: currentUser.id
    };

    const { error } = await supabase.from("warranty_claims").insert(claim);
    if (error) { alert("Error: " + error.message); return; }
    alert("Claim submitted!");
    loadClaims();
  }

  async function loadClaims() {
    let query = supabase.from("warranty_claims").select("*").order("created_at",{ascending:false});

    if (currentRole === "field") {
      query = query.eq("user_id", currentUser.id);
    }

    const { data, error } = await query;
    if (error) { alert("Error loading claims: " + error.message); return; }

    const claimsDiv = document.getElementById("claims");
    claimsDiv.innerHTML = "";

    data.forEach(claim => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <b>${claim.customer_name}</b> | ${claim.machine_model} | SN: ${claim.serial_no}<br>
        Problem: ${claim.problem_summary}<br>
        Status: ${claim.claim_status || "Pending"}<br>
        Service Approval: ${claim.service_manager_approval || "-"}<br>
        Warranty Approval: ${claim.warranty_manager_approval || "-"}<br>
        Final: ${claim.final_decision || "-"}<br>
      `;

      if (currentRole === "service" && !claim.service_manager_approval) {
        div.innerHTML += `<button onclick="approveClaim(${claim.id}, 'service')">Service Approve</button>`;
      }

      if (currentRole === "warranty" && claim.service_manager_approval === "Approved" && !claim.warranty_manager_approval) {
        div.innerHTML += `<button onclick="approveClaim(${claim.id}, 'warranty')">Warranty Approve</button>`;
      }

      claimsDiv.appendChild(div);
    });
  }

  async function approveClaim(id, type) {
    if (currentRole !== "service" && currentRole !== "warranty") return;

    let update = {};
    if (type === "service" && currentRole === "service") {
      update = { service_manager_approval: "Approved" };
    }
    if (type === "warranty" && currentRole === "warranty") {
      update = { warranty_manager_approval: "Approved", final_decision: "Approved" };
    }

    const { error } = await supabase.from("warranty_claims").update(update).eq("id", id);
    if (error) { alert("Error: " + error.message); return; }
    alert("Updated!");
    loadClaims();
  }
</script>
</body>
</html>
