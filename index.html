  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // NOTE: This uses a publicly available demo key and URL.
    const SUPABASE_URL = 'https://vebjjlfjlhobatqqwlfq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlYmpqbGZqbGhvYmF0cXF3bGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMzY5NTMsImV4cCI6MjA3NDcxMjk1M30.Ks1ZHFAELRJvh3ppjNdVFPrhiwv7lTYg3mwiLgmSw60';
    
    // FIX 2: Added auth configuration to prevent session refresh on tab change
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
            autoRefreshToken: false, // Prevents re-authentication logic on browser tab focus
            detectSessionInUrl: false
        }
    });
    window.supabaseClient = supabaseClient;

    function formatDate(iso){ if(!iso) return '-'; return new Date(iso).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
    function getStatusClass(status){
      switch(status){
        case 'Submitted': return 'bg-warning text-dark';
        case 'SCE_Approved': return 'bg-primary text-white';
        case 'SCE_Rejected': return 'bg-danger text-white';
        case 'Manager_Approved': return 'bg-success text-white';
        case 'Manager_Rejected': return 'bg-danger text-white';
        case 'Closed': return 'bg-secondary text-white';
        case 'Admin_Closed': return 'bg-dark text-white';
        default: return 'bg-light text-dark';
      }
    }

    async function fetchClaims(){
      const { data, error } = await supabaseClient.from('claims').select('*').order('date_raised',{ascending:false});
      if(error) throw error; return data||[];
    }
    
    // --- START OF FILE UPLOAD/CLAIM SUBMISSION UPDATE (MODIFIED for DIRECT UPLOAD) ---
    async function submitClaim(payload, file) {
        let finalFilePath = null;
        let newClaimId = null;

        // 1. Insert Claim Data into the database to get the Claim ID
        const { data: claimData, error: insertError } = await supabaseClient.from('claims').insert({
            ...payload,
            date_raised: new Date().toISOString(),
            status: 'Submitted',
            // Set to empty string '' to satisfy NOT NULL constraint
            document_url: '' 
        }).select('id').single();

        if (insertError) {
            throw insertError;
        }

        newClaimId = claimData.id;

        // 2. Direct Upload the file to the final path if file is present
        if (file) {
            const fileExtension = file.name.split('.').pop();
            // Define the final path: [user_id]/[claim_id].[extension]
            finalFilePath = `${payload.user_id}/${newClaimId}.${fileExtension}`;

            // Direct Upload to final path (REPLACES UPLOAD TO TEMP + MOVE)
            const { error: uploadError } = await supabaseClient.storage
                .from('claim-documents')
                .upload(finalFilePath, file, {
                    cacheControl: '3600',
                    upsert: false // New upload
                });

            if (uploadError) {
                // Log and continue. The claim is submitted, but the document failed.
                console.error("Document upload failed after claim submission. Check RLS and bucket policy:", uploadError);
                // The claim remains in the DB with document_url: ''
            } else {
                // 3. Get the public URL for the final path and update the claim row
                const { data: urlData } = supabaseClient.storage
                    .from('claim-documents')
                    .getPublicUrl(finalFilePath);

                // Check for URL data presence
                if (urlData && urlData.publicUrl) {
                    const { error: updateError } = await supabaseClient.from('claims')
                        .update({ document_url: urlData.publicUrl })
                        .eq('id', newClaimId);

                    if (updateError) {
                        console.error("Failed to update claim with document URL:", updateError);
                    }
                } else {
                     // Log failure if URL data is missing (e.g., bucket not public)
                    console.error("getPublicUrl failed or returned no URL for path:", finalFilePath, urlData);
                }
            }
        }

        // Return the inserted claim data
        return claimData;
    }
    // --- END OF FILE UPLOAD/CLAIM SUBMISSION UPDATE (MODIFIED for DIRECT UPLOAD) ---

    async function updateClaimApproval(id,action,notes,role,currentUser){
      let update={};
      const approvalDate = new Date().toISOString();

      if(role==='sce') {
        update={ status:action==='approve'?'SCE_Approved':'SCE_Rejected', sce_notes:notes, sce_approval_date: approvalDate };
      }
      if(role==='manager') {
        update={ status:action==='approve'?'Manager_Approved':'Manager_Rejected', manager_notes:notes, manager_approval_date: approvalDate };
      }
      
      const { error } = await supabaseClient.from('claims').update(update).eq('id',id);
      if(error) throw error; return true;
    }
    async function handleAdminAction(id,close){
      const { error } = await supabaseClient.from('claims').update({status: close?'Admin_Closed':'Submitted', admin_action_date: new Date().toISOString()}).eq('id',id);
      if(error) throw error; return true;
    }
    async function fetchUserRole(uid){
      // ADD 'name' to the select query
      const { data, error } = await supabaseClient.from('user_profiles').select('role,email,name').eq('id',uid).single(); 
      // Return the fetched name, falling back to email if name is null, then 'Unknown'
      if(error) return {role:'field', name:'Unknown'}; 
      return {role:data.role, name:data.name || data.email}; 
    }
    
    // NEW FUNCTIONALITY: Admin user creation
    async function addNewUser(email, password, role) {
      // 1. Create user in Supabase Auth
      // Note: This requires the user running this function (the Admin) to have the necessary Row Level Security (RLS) policies and/or a Service Role Key, 
      // but in this client-side demo, we rely on the Admin role having RLS enabled for 'insert' on 'user_profiles' and the default Supabase Auth RLS.
      const { data: authData, error: authError } = await supabaseClient.auth.signUp({
        email,
        password,
      });
      if (authError) throw authError;
      
      const userId = authData.user.id;

      // 2. Insert profile with role into user_profiles table
      const { error: profileError } = await supabaseClient.from('user_profiles').insert({
        id: userId,
        email: email, // Store email for easier retrieval
        role: role
      });

      if (profileError) {
        // In a real app, you might try to delete the auth user here if the profile insert failed
        throw profileError;
      }
      
      return true;
    }


    window.wf = { fetchClaims, submitClaim, updateClaimApproval, handleAdminAction, fetchUserRole, formatDate, getStatusClass, addNewUser };
  </script>


<script type="text/babel">

/* -----------------------
   Auth form
   ----------------------- */
function AuthForm({ onSignIn, message }) {
  const [loading, setLoading] = useState(false);
  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    const email = e.target.email.value;
    const password = e.target.password.value;
    try {
      await onSignIn(email, password);
    } catch (err) {
      // error message already handled by parent
    } finally {
      setLoading(false);
    }
  }
  return (
    <div className="d-flex justify-content-center align-items-center" style={{minHeight:'60vh'}}>
      {/* UPDATED: Increased maxWidth for the login container */}
      <div className="card wf-card shadow-xl" style={{maxWidth:800, width:'100%'}}>
        <div className="row g-0">
          {/* UPDATED: Auth sidebar color to match new theme */}

              <i className="bi bi-gear-fill" style={{fontSize:'4rem', color:'var(--wf-primary)'}}></i>
              <h4 className="mt-3 fw-bold" style={{color:'var(--wf-primary-dark)'}}>Construction Equipment</h4>
              <p className="small-muted mt-2">Access your claim management console.</p>

          </div>

              <h4 className="mb-1 fw-bold">Sign In</h4>
              <p className="small-muted mb-4">Use your organizational credentials</p>
              {message && <div className="alert alert-danger py-2 small fw-bold">{message}</div>}
              <form onSubmit={handleSubmit}>
                <div className="mb-3">
                  <label className="form-label small fw-bold">Email</label>
                  <input name="email" type="email" className="form-control" placeholder="Email" required />
                </div>
                <div className="mb-4">
                  <label className="form-label small fw-bold">Password</label>
                  <input name="password" type="password" className="form-control" placeholder="Password" required />
                </div>
                <div className="d-grid">
                  <button className="btn btn-wf-primary btn-lg" type="submit" disabled={loading}>
                    {loading ? <span className="spinner-border spinner-border-sm me-2"></span> : <i className="bi bi-box-arrow-in-right me-2"></i>} Sign In

/* -----------------------
   Notification modal (Bootstrap)
   ----------------------- */
function NotificationModal({ open, title, message, onClose, type = 'success' }) {
  const ref = useRef();
  useEffect(() => {
    if (!ref.current) return;
    const bs = bootstrap.Modal.getOrCreateInstance(ref.current);
    open ? bs.show() : bs.hide();
  }, [open]);

  const iconClass = type === 'success' ? "bi bi-check-circle-fill text-success" : "bi bi-exclamation-triangle-fill text-danger";
  const buttonClass = type === 'success' ? 'btn-wf-primary' : 'btn-outline-secondary';

  return (
    <div className="modal fade" ref={ref} tabIndex="-1">
      <div className="modal-dialog modal-sm modal-dialog-centered">
        <div className="modal-content wf-card shadow-lg">
          <div className="modal-body p-4 text-center">
            <i className={`${iconClass} display-4 mb-3`}></i>
            <h5 className="mb-2 fw-bold">{title}</h5>
            <p className="small-muted mb-0">{message}</p>
          </div>
          <div className="modal-footer border-0 justify-content-center">
            <button className={`btn ${buttonClass} fw-bold`} onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* -----------------------
   Confirm Modal
   ----------------------- */

/* -----------------------
   Change Password Modal
   ----------------------- */
function ChangePasswordModal({ open, onClose, showNotif }) {
  const ref = useRef();
  const [loading, setLoading] = useState(false);
  const [password, setPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [error, setError] = useState(null);

  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;
  
  useEffect(() => {
    if (!ref.current) return;
    const modalElement = ref.current;
    
    const handleHidden = () => {
        setPassword('');
        setConfirmPassword('');
        setError(null);
        onCloseRef.current(); 
    };

    modalElement.addEventListener('hidden.bs.modal', handleHidden);
    
    return () => {
        modalElement.removeEventListener('hidden.bs.modal', handleHidden);
    };
  }, []); 

  useEffect(() => {
    if (!ref.current) return;
    const bs = bootstrap.Modal.getOrCreateInstance(ref.current);
    open ? bs.show() : bs.hide();
  }, [open]);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    if (password !== confirmPassword) {
      setError("Passwords do not match.");
      return;
    }
    if (password.length < 6) {
      setError("Password must be at least 6 characters.");
      return;
    }

    setLoading(true);
    try {
      const { error } = await window.supabaseClient.auth.updateUser({ password });
      
      if (error) throw error;

      const bs = bootstrap.Modal.getInstance(ref.current);
      if (bs) bs.hide();
      
      showNotif('Password Updated', 'Your password has been changed successfully. You may need to sign in again.', 'success');

    } catch (err) {
      setError(err.message || 'Failed to update password.');
      console.error("Password update error:", err);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal fade" ref={ref} tabIndex="-1">
      <div className="modal-dialog modal-sm modal-dialog-centered">
        <div className="modal-content wf-card shadow-lg">
          <div className="modal-header border-bottom">
            <h5 className="modal-title fw-bold"><i className="bi bi-key me-2"></i>Change Password</h5>
            <button className="btn-close" onClick={onClose} type="button"></button>
          </div>
          <form onSubmit={handleSubmit}>
            <div className="modal-body p-4">
              {error && <div className="alert alert-danger py-2 small fw-bold">{error}</div>}
              
              <div className="mb-3">
                <label className="form-label small fw-bold">New Password</label>
                <input 
                  type="password" 
                  className="form-control" 
                  value={password} 
                  onChange={(e) => setPassword(e.target.value)} 
                  required 
                  minLength="6"
                  placeholder="New Password"
                />
              </div>
              <div className="mb-2">
                <label className="form-label small fw-bold">Confirm Password</label>
                <input 
                  type="password" 
                  className="form-control" 
                  value={confirmPassword} 
                  onChange={(e) => setConfirmPassword(e.target.value)} 
                  required
                  placeholder="Confirm New Password"
                />
              </div>
              <p className="small-muted mt-3 mb-0">Note: Changing your password may require you to sign in again.</p>
            </div>
            <div className="modal-footer border-0">
              <button type="button" className="btn btn-outline-secondary fw-bold" onClick={onClose} disabled={loading}>Cancel</button>
              <button type="submit" style={{background:'var(--wf-primary-dark)'}} className="btn text-white fw-bold" disabled={loading || password.length < 6}>

              </button>

          </form>
        </div>
      </div>
    </div>
  );
}

/* -----------------------
   Add User Modal (NEW COMPONENT)
   ----------------------- */
function AddUserModal({ open, onClose, showNotif }) {
  const ref = useRef();
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;

  // Hook for Bootstrap modal visibility and cleanup
  useEffect(() => {
    if (!ref.current) return;
    const bs = bootstrap.Modal.getOrCreateInstance(ref.current);
    
    // Cleanup function when modal is hidden
    const handleHidden = () => {
        setError(null);
        onCloseRef.current(); 
    };

    const modalElement = ref.current;
    modalElement.addEventListener('hidden.bs.modal', handleHidden);

    open ? bs.show() : bs.hide();
    
    return () => {
        modalElement.removeEventListener('hidden.bs.modal', handleHidden);
    };
  }, [open]);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    setLoading(true);

    const fd = new FormData(e.target);
    const email = fd.get('email');
    const password = fd.get('password');
    const role = fd.get('role');

    if (password.length < 6) {
      setError("Password must be at least 6 characters.");
      setLoading(false);
      return;
    }
    
    try {
      await window.wf.addNewUser(email, password, role);

      const bs = bootstrap.Modal.getInstance(ref.current);
      if (bs) bs.hide();
      
      showNotif('User Created', `User ${email} created successfully with role ${role.toUpperCase()}. An email confirmation has been sent.`, 'success');
      e.target.reset();

    } catch (err) {
      setError(err.message || 'Failed to create user.');
      console.error("User creation error:", err);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal fade" ref={ref} tabIndex="-1">
      <div className="modal-dialog modal-md modal-dialog-centered">
        <div className="modal-content wf-card shadow-lg">
          <div className="modal-header border-bottom">
            <h5 className="modal-title fw-bold" style={{color:'var(--wf-primary-dark)'}}><i className="bi bi-person-plus-fill me-2"></i>Add New User</h5>
            <button className="btn-close" onClick={onClose} type="button"></button>
          </div>
          <form onSubmit={handleSubmit}>
            <div className="modal-body p-4">
              {error && <div className="alert alert-danger py-2 small fw-bold">{error}</div>}
              
              <div className="mb-3">
                <label className="form-label small fw-bold">Email (Username)</label>
                <input 
                  type="email" 
                  name="email"
                  className="form-control" 
                  required 
                  placeholder="user@company.com"
                />
              </div>
              
              <div className="row mb-3">
                <div className="col-md-6">
                  <label className="form-label small fw-bold">Temporary Password</label>
                  <input 
                    type="password" 
                    name="password"
                    className="form-control" 
                    required 
                    minLength="6"
                    placeholder="Min 6 characters"
                  />
                </div>
                <div className="col-md-6">
                  <label className="form-label small fw-bold">Role</label>
                  <select name="role" className="form-select" required>
                    <option value="field">Field (Default)</option>
                    <option value="sce">SCE</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>
              </div>

              <p className="small-muted mt-3 mb-0">Note: The user will receive a confirmation email. They should use the temporary password provided.</p>
            </div>
            <div className="modal-footer border-0">
              <button type="button" className="btn btn-outline-secondary fw-bold" onClick={onClose} disabled={loading}>Cancel</button>
              <button type="submit" className="btn btn-wf-primary fw-bold" disabled={loading}>
                {loading ? <span className="spinner-border spinner-border-sm me-2"></span> : <i className="bi bi-person-plus me-2"></i>} Create User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}


/* -----------------------
   Claim Detail Modal
   ----------------------- */
function ClaimDetailModal({ claim, open, onClose }) {
  const ref = useRef();

  // Function to call when a button is clicked to trigger Bootstrap's hide transition
  const handleHide = () => {
    const bs = bootstrap.Modal.getInstance(ref.current);
    if (bs) {
        // Trigger Bootstrap's hide transition, which will fire 'hidden.bs.modal'
        bs.hide(); 
    }
  };

  useEffect(() => {
    if (!ref.current) return;
    const bs = bootstrap.Modal.getOrCreateInstance(ref.current);
    const modalElement = ref.current;

    // Listen for the 'hidden' event and call React's onClose only when 
    // Bootstrap has fully removed the modal and its backdrop.
    modalElement.addEventListener('hidden.bs.modal', onClose); 

    // Control visibility
    if (open) {
      bs.show();
    } 

    // Cleanup function to remove event listener
    return () => {
        modalElement.removeEventListener('hidden.bs.modal', onClose);
    }
  }, [open, onClose]); // open dependency is still needed for initial show()

  if (!claim) return null;

  const isApproved = claim.status.includes('Approved');
  const isRejected = claim.status.includes('Rejected');

  // --- START OF FIX: Calculate correct SCE Review Status ---
  const sceReviewStatus = 
    claim.status === 'Submitted' ? 'Submitted' : 
    claim.status === 'SCE_Rejected' ? 'SCE_Rejected' : 
    'SCE_Approved'; // If anything else (SCE_Approved, Manager_*, Closed, Admin_Closed), it passed SCE.
  
  // --- START OF FIX: Calculate correct Manager Review Status ---
  let managerReviewStatus = 'bg-light text-dark'; // Default status for N/A
  let managerReviewDisplay = 'N/A';

  if (claim.status === 'SCE_Approved') {
      // Use 'Submitted' status styling (usually warning/pending) and display 'Pending'
      managerReviewStatus = 'Submitted'; 
      managerReviewDisplay = 'Pending';
  } else if (claim.status.startsWith('Manager_') || claim.status.startsWith('Closed') || claim.status.startsWith('Admin_Closed')) {
      // Use the actual Manager outcome or Closed status
      managerReviewStatus = claim.status;
      managerReviewDisplay = claim.status.replace('_',' ');
  }
  // --- END OF FIX ---

  // --- START OF NEW FILE DOWNLOAD SECTION ---
  // FIX: document_url can be an empty string '', so check for length > 0
  const documentAvailable = claim.document_url && claim.document_url.length > 0;
  // --- END OF NEW FILE DOWNLOAD SECTION ---

  return (
    <div className="modal fade" ref={ref} tabIndex="-1">
      <div className="modal-dialog modal-lg modal-dialog-scrollable">
        <div className="modal-content wf-card">
          <div className="modal-header border-bottom">
            <h5 className="modal-title fw-bold"><i className="bi bi-card-text me-2"></i> Claim Details</h5>
            <button className="btn-close" onClick={handleHide}></button> 
          </div>
          <div className="modal-body p-4">
            <h4 className="mb-3 text-primary">{claim.title}</h4>
            <div className={`p-3 mb-4 rounded-3 text-center ${isApproved ? 'bg-success-subtle text-success' : isRejected ? 'bg-danger-subtle text-danger' : 'bg-warning-subtle text-warning'}`}>
                Current Status: <span className="fw-bold fs-6">{claim.status.replace('_',' ')}</span>
            </div>
            
            {/* --- START OF NEW FILE DOWNLOAD SECTION IN MODAL --- */}
            <h6 className="fw-bold mb-3 border-bottom pb-2">Supporting Documents</h6>
            <div className="mb-4">
                {documentAvailable ? (
                    <a href={claim.document_url} target="_blank" rel="noopener noreferrer" className="btn btn-outline-primary fw-bold">
                        <i className="bi bi-file-earmark-arrow-down-fill me-2"></i> Download Supporting Document (.docx)
                    </a>
                ) : (
                    <p className="small-muted">No supporting document uploaded for this claim.</p>
                )}
            </div>
            {/* --- END OF NEW FILE DOWNLOAD SECTION IN MODAL --- */}


            <h6 className="fw-bold mb-3 border-bottom pb-2">Equipment & Failure Information</h6>
            <dl className="row small">
              <dt className="col-sm-3 fw-medium">Claim ID</dt><dd className="col-sm-9 mono">{claim.id}</dd>
              <dt className="col-sm-3 fw-medium">Raised By</dt><dd className="col-sm-9">{claim.raised_by || claim.user_id?.slice(0,8)}</dd> {/* ADDED RAISED BY */}
              <dt className="col-sm-3 fw-medium">Customer</dt><dd className="col-sm-9">{claim.customer_name || '-'}</dd>
              <dt className="col-sm-3 fw-medium">Model / Serial</dt><dd className="col-sm-9">{claim.machine_model || '-'} / {claim.equipment_serial || '-'}</dd>
              <dt className="col-sm-3 fw-medium">Failure Component</dt><dd className="col-sm-9">{claim.failure_component || '-'} (Part: {claim.failure_part_no || '-'})</dd>
              <dt className="col-sm-3 fw-medium">Running Hour</dt><dd className="col-sm-9">{claim.running_hour || '-'}</dd>
              <dt className="col-sm-3 fw-medium">Failure Date</dt><dd className="col-sm-9">{window.wf.formatDate(claim.failure_date)}</dd>
            </dl>

            <h6 className="fw-bold mt-4 mb-3 border-bottom pb-2">Description</h6>
            <p className="small">{claim.description || 'No detailed description provided.'}</p>
            
            <h6 className="fw-bold mt-4 mb-3 border-bottom pb-2">Approval Flow</h6>
            <div className="row">
                {/* Note: Internal cards use bg-light, which is fine and doesn't get the backdrop-filter */}
                <div className="col-md-6 mb-3">
                    <div className="card h-100 bg-light border-0 shadow-sm p-3">
                        <div className="small-muted fw-bold mb-2">SCE Review</div>
                        {/* CORRECTED SCE STATUS LOGIC */}
                        <p className="mb-1 small">Status: <span className={`status-pill ${window.wf.getStatusClass(sceReviewStatus)}`}>{sceReviewStatus.replace('_',' ')}</span></p>
                        <p className="mb-1 small">Date: {window.wf.formatDate(claim.sce_approval_date) || '-'}</p>
                        <p className="mb-0 small fw-medium mt-2">Notes:</p>
                        <p className="small fst-italic">{claim.sce_notes || 'No notes.'}</p>
                    </div>
                </div>
                <div className="col-md-6 mb-3">
                    <div className="card h-100 bg-light border-0 shadow-sm p-3">
                        <div className="small-muted fw-bold mb-2">Manager Review</div>
                        {/* CORRECTED MANAGER STATUS LOGIC */}
                        <p className="mb-1 small">Status: <span className={`status-pill ${window.wf.getStatusClass(managerReviewStatus)}`}>{managerReviewDisplay}</span></p>
                        <p className="mb-1 small">Date: {window.wf.formatDate(claim.manager_approval_date) || '-'}</p>
                        <p className="mb-0 small fw-medium mt-2">Notes:</p>
                        <p className="small fst-italic">{claim.manager_notes || 'No notes.'}</p>
                    </div>
                </div>
            </div>
            
          </div>
          <div className="modal-footer border-0">
            <button className="btn btn-outline-secondary fw-bold" onClick={handleHide}>Close</button> 
          </div>
        </div>
      </div>
    </div>
  );
}

/* -----------------------
   Field Dashboard (New Claim + History)
   ----------------------- */
function FieldDashboard({ currentUser, claims, onRefresh, onOpenDetail }) {
  const [msg, setMsg] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  // FIX: New state to manage active tab without relying on Bootstrap's JS for styling
  const [activeTab, setActiveTab] = useState('new'); 

  async function handleSubmit(e) {
    e.preventDefault();
    setSubmitting(true);
    setMsg(null);
    const fd = new FormData(e.target);

    // --- START OF FILE HANDLING ---
    const fileInput = e.target.supporting_doc;
    const file = fileInput.files[0];
    
    if (file) {
        const fileType = file.name.split('.').pop().toLowerCase();
        if (fileType !== 'docx') {
            setMsg({ type: 'error', text: 'Invalid file format. Only .docx files are supported.' });
            setSubmitting(false);
            return;
        }
    }
    // --- END OF FILE HANDLING ---

    // --- START OF REQUIRED FIELD PARSING (REMOVED || NULL CHECKS) ---
    const payload = {
      title: fd.get('title'),
      description: fd.get('description'),
      customer_name: fd.get('customer_name'),
      machine_model: fd.get('machine_model'),
      equipment_serial: fd.get('equipment_serial'),
      // Now required and parsed as integer
      running_hour: parseInt(fd.get('running_hour')),
      // Now required
      failure_date: fd.get('failure_date'),
      failure_component: fd.get('failure_component'),
      failure_part_no: fd.get('failure_part_no'),
      raised_by: currentUser.email,
      user_id: currentUser.id
    };
    // --- END OF REQUIRED FIELD PARSING ---

    try {
      // --- UPDATED: Pass the file to submitClaim ---
      await window.wf.submitClaim(payload, file); 
      // --- END UPDATED ---

      setMsg({ type: 'success', text: 'Claim submitted successfully! Check the History tab.' });
      e.target.reset();
      await onRefresh();
      // FIX: Update React state to switch tab
      setActiveTab('history'); 

    } catch (err) {
      console.error(err);
      setMsg({ type: 'error', text: err.message || 'Submission failed. Check console for details.' });
    } finally {
      setSubmitting(false);
    }
  }

  const userClaims = claims.filter(c => (c.user_id === currentUser.id || c.raised_by === currentUser.email));

  return (
    <div className="card wf-card p-4 mb-3">
      <div className="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h5 style={{color:'var(--wf-primary-dark)'}} className="mb-0 fw-bold"><i className="bi bi-person-badge me-2"></i>Field Dashboard</h5>

      </div>

        <li className="nav-item me-2">
            <button 
                className={`nav-link fw-bold ${activeTab === 'new' ? 'wf-tab-active' : 'wf-tab-inactive'}`}
                onClick={() => setActiveTab('new')}

                New Claim
            </button>
        </li>
        <li className="nav-item">
            <button 
                className={`nav-link fw-bold ${activeTab === 'history' ? 'wf-tab-active' : 'wf-tab-inactive'}`}
                onClick={() => setActiveTab('history')}
            >
                History <span className={`badge ms-2 ${activeTab === 'history' ? 'bg-white text-primary' : 'bg-light text-dark'}`}>{userClaims.length}</span>
            </button>
        </li>
      </ul>

      <div className="tab-content">
        {/* FIX: Conditionally show content based on React state */}
        <div className={`tab-pane fade ${activeTab === 'new' ? 'show active' : ''}`}>
          <form onSubmit={handleSubmit} className="row g-4">
            <h6 className="fw-bold text-secondary border-bottom pb-2">Customer & Equipment Details</h6>
            <div className="col-md-6">

/* -----------------------
   Approval Dashboard (SCE / Manager)
   ----------------------- */
function ApprovalDashboard({ role, currentUser, claims, onRefresh, onOpenDetail, showNotif }) {
  const [tab, setTab] = useState('pending');
  const [processingId, setProcessingId] = useState(null);
  const [notes, setNotes] = useState({});

  // Filter claims based on the role and current status
  const pending = claims.filter(c => (role==='sce' ? c.status === 'Submitted' : c.status === 'SCE_Approved'));
  const history = claims.filter(c => {
    if (role === 'sce') return c.status.startsWith('SCE_') || c.status.startsWith('Manager_') || c.status.startsWith('Closed');
    if (role === 'manager') return c.status.startsWith('Manager_') || c.status.startsWith('Closed');
    return false;
  });

  // Manager specific: To show all claims
  const allClaims = claims; 

  async function handleAction(claimId, action) {
    setProcessingId(claimId);
    try {
      await window.wf.updateClaimApproval(claimId, action, notes[claimId] || '', role, currentUser);
      await onRefresh();
      showNotif('Success', `Claim ${claimId.slice(0,8)} successfully ${action === 'approve' ? 'Approved' : 'Rejected'}.`);
      setNotes(prev => { delete prev[claimId]; return {...prev}; });
    } catch (err) {
      showNotif('Error', err.message || 'Action failed');
    } finally {
      setProcessingId(null);
    }
  }

  return (
    <div className="card wf-card p-4 mb-3">
      <div className="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h5 style={{color:'var(--wf-primary-dark)'}}className="mb-0 fw-bold"><i className={`bi bi-${role==='sce'?'person-check-fill':'award-fill'} me-2`}></i>{role.toUpperCase()} Approval Dashboard</h5>
        <div className="small-muted">Review pending claims</div>
      </div>

      <ul className="nav nav-pills mb-4">
        <li className="nav-item">
            {/* FIX 1: Apply wf-tab-active/inactive classes for consistent styling */}
            <button className={`nav-link fw-bold ${tab==='pending'?'wf-tab-active':'wf-tab-inactive'}`} onClick={()=>setTab('pending')}>
                Pending ({pending.length})
            </button>
        </li>
        <li className="nav-item ms-2">
            {/* FIX 1: Apply wf-tab-active/inactive classes for consistent styling */}
            <button className={`nav-link fw-bold ${tab==='history'?'wf-tab-active':'wf-tab-inactive'}`} onClick={()=>setTab('history')}>
                {/* UPDATED LOGIC: SCE now also shows "All Claims" */}
                {(role === 'manager' || role === 'sce') ? `All Claims (${allClaims.length})` : `History (${history.length})`}
            </button>
        </li>
      </ul>

      {tab === 'pending' && (
        <>
          {pending.length === 0 && <p className="small-muted p-4 text-center">🎉 All clear! No pending claims requiring your attention.</p>}
          {pending.map(c => (
            <div key={c.id} className="card mb-3 shadow-lg border-start border-5 border-warning rounded-4 wf-card"> {/* Added wf-card class to approval items */}
              <div className="card-body">
                <div className="d-flex justify-content-between align-items-start">
                  <div>
                    <h6 className="mb-1 text-primary fw-bold">{c.title}</h6>
                    <div className="small-muted">Customer: {c.customer_name} • <span className="mono">{c.id.slice(0,8)}</span></div>
                  </div>
                  <div>
                    <span className={`status-pill ${window.wf.getStatusClass(c.status)}`}>{c.status.replace('_',' ')}</span>
                  </div>
                </div>

                <p className="mt-3 mb-3 border-top pt-3 small text-break">{c.description.substring(0, 150)}{c.description.length > 150 ? '...' : ''}</p>

                <div className="mb-3">
                  <textarea className="form-control" rows="3" placeholder={`Add ${role.toUpperCase()} notes/justification (required for rejection)...`} value={notes[c.id]||''} onChange={(e)=>setNotes(prev=>({...prev, [c.id]: e.target.value}))}></textarea>
                </div>

                <div className="d-flex gap-2">
                  <button className="btn btn-success fw-bold flex-grow-1" disabled={processingId===c.id} onClick={()=>handleAction(c.id,'approve')}>
                    {processingId===c.id ? <span className="spinner-border spinner-border-sm me-2"></span> : <i className="bi bi-check-circle me-2"></i>} Approve
                  </button>
                  <button className="btn btn-danger fw-bold flex-grow-1" disabled={processingId===c.id} onClick={()=>handleAction(c.id,'reject')}>
                    {processingId===c.id ? <span className="spinner-border spinner-border-sm me-2"></span> : <i className="bi bi-x-circle me-2"></i>} Reject
                  </button>
                  <button className="btn btn-outline-secondary ms-auto fw-bold" onClick={()=>onOpenDetail(c)}>Details</button>
                </div>
              </div>
            </div>
          ))}
        </>
      )}

      {tab === 'history' && (
        <div className="list-group">
        {/* UPDATED LOGIC: SCE (role==='sce') now also uses the table view of allClaims */}
        {(role === 'manager' || role === 'sce') ? (
             <div className="table-responsive">
                <table className="table table-hover table-sm align-middle">
                    <thead className="table-light">
                        <tr><th>ID</th><th>Customer</th><th>Title</th><th>Raised By</th><th>Status</th><th>Raised</th><th></th></tr>
                    </thead>
                    <tbody>
                        {allClaims.length === 0 && <tr><td colSpan="6" className="small-muted p-4 text-center">No claims found.</td></tr>}
                        {allClaims.map(c => (
                            <tr key={c.id} style={{cursor:'pointer'}} onClick={()=>onOpenDetail(c)} className="shadow-sm border-bottom">
                                <td className="mono small">{c.id.slice(0,8)}</td>
                                <td className="fw-medium">{c.customer_name}</td>
                                <td>{c.title}</td>
                                <td>{c.raised_by || c.user_id?.slice(0,8)}</td>
                                <td><span className={`status-pill ${window.wf.getStatusClass(c.status)}`}>{c.status.replace('_',' ')}</span></td>
                                <td className="small-muted">{window.wf.formatDate(c.date_raised)}</td>
                                <td><i className="bi bi-chevron-right small text-muted"></i></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        ) : (
            <>
                {history.length === 0 && <p className="small-muted p-3 text-center">No review history yet.</p>}
                {history.map(c => (
                    <div key={c.id} className="list-group-item list-group-item-action d-flex justify-content-between align-items-center wf-card mb-2 p-3" onClick={()=>onOpenDetail(c)} style={{borderRadius: '12px', cursor:'pointer'}}>
                    <div>
                        <div className="fw-bold">{c.title}</div>
                        <div className="small-muted">Customer: {c.customer_name} • Raised: {window.wf.formatDate(c.date_raised)}</div>
                    </div>
                    <span className={`status-pill ${window.wf.getStatusClass(c.status)}`}>{c.status.replace('_',' ')}</span>
                    </div>
                ))}
            </>
        )}
        </div>
      )}
    </div>
  );
}

/* -----------------------
   Admin Dashboard
   ----------------------- */
function AdminDashboard({ currentUser, claims, onRefresh, onOpenDetail, openConfirm, showNotif, openAddUserModal }) {
  
  function confirmToggle(c) {
    const toClose = !(c.status === 'Admin_Closed' || c.status === 'Closed');
    const actionText = toClose ? 'Close' : 'Reopen';
    
    // Using ConfirmModal instead of native confirm()
    openConfirm(
      `${actionText} Claim`,
      `Are you sure you want to ${actionText.toLowerCase()} claim ${c.id.slice(0,8)}? This action is powerful and updates the status.`,
      () => toggleClose(c, toClose)
    );
  }

  async function toggleClose(c, toClose) {
    try {
      await window.wf.handleAdminAction(c.id, toClose);
      await onRefresh();
      showNotif('Success', `Claim ${c.id.slice(0,8)} has been successfully ${toClose ? 'closed' : 'reopened'}.`, 'success');
    } catch (err) {
      showNotif('Error', err.message || 'Admin action failed', 'error');
    }
  }

  return (
    <div className="card wf-card p-4 mb-3">
      <div className="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h5 style={{color:'var(--wf-primary-dark)'}} className="mb-0 fw-bold"><i className="bi bi-person-fill-gear me-2"></i>Admin Master View</h5>
        {/* NEW BUTTON: Button to open the Add User Modal */}
        <button className="btn btn-wf-primary fw-bold" onClick={openAddUserModal}>
          <i className="bi bi-person-plus-fill me-2"></i>Add User
        </button>
      </div>

      <div className="table-responsive">
        <table className="table table-hover table-sm align-middle">
          <thead className="table-light">
            <tr><th>ID</th><th>Customer</th><th>Title</th><th>Raised By</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody>
            {claims.map(c => (
              <tr key={c.id} className="shadow-sm border-bottom">
                <td className="mono small">{c.id.slice(0,8)}</td>
                <td className="fw-medium">{c.customer_name}</td>
                <td>{c.title}</td>
                <td>{c.raised_by || c.user_id?.slice(0,8)}</td>
                <td><span className={`status-pill ${window.wf.getStatusClass(c.status)}`}>{c.status.replace('_',' ')}</span></td>
                <td>
                  <div className="d-flex gap-2">
                    <button className="btn btn-outline-success fw-bold" onClick={()=>onOpenDetail(c)}>Details</button>
                    <button className="btn btn-sm btn-outline-danger fw-bold" onClick={()=>confirmToggle(c)}>{(c.status==='Admin_Closed' || c.status==='Closed') ? 'Reopen' : 'Close'}</button>
                  </div>
                </td>
              </tr>
            ))}
            {claims.length === 0 && <tr><td colSpan="6" className="p-4 small-muted text-center">No claims found in the database.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* -----------------------
   Top-level App
   ----------------------- */
function App() {
  const [session, setSession] = useState(null);
  const [userProfile, setUserProfile] = useState(null);
  const [roleView, setRoleView] = useState('field');
  const [isAdmin, setIsAdmin] = useState(false);
  const [claims, setClaims] = useState([]);
  const [loading, setLoading] = useState(false);
  const [authMsg, setAuthMsg] = useState('');
  const [notif, setNotif] = useState({open:false, title:'', message:'', type:'success'});
  const [confirmState, setConfirmState] = useState({open:false, title:'', message:'', cb:null});
  const [selectedClaim, setSelectedClaim] = useState(null);
  const [detailOpen, setDetailOpen] = useState(false);
  const [passwordModalOpen, setPasswordModalOpen] = useState(false);
  // NEW STATE: State for the Add User Modal
  const [addUserModalOpen, setAddUserModal] = useState(false); 


  useEffect(()=> {
    // initial session check
    window.supabaseClient.auth.getSession().then(({data})=>{
      if (data && data.session) {
        setSession(data.session);
        initForSession(data.session);
      }
    });

    const { data: listener } = window.supabaseClient.auth.onAuthStateChange((_event, session) => {
      setSession(session);
      if(session) initForSession(session);
      else {
        setUserProfile(null);
        setClaims([]);
      }
    });

    return ()=> listener.subscription.unsubscribe();
  }, []);

  async function initForSession(session) {
    try {
      const profile = await window.wf.fetchUserRole(session.user.id);
      setUserProfile({ id: session.user.id, email: profile.name, role: profile.role });
      setRoleView(profile.role || 'field');
      setIsAdmin(profile.role === 'admin');
      await loadClaims();
    } catch (err) {
      console.error(err);
      showNotif('Profile Error', err.message || 'Failed to load profile or role.', 'error');
    }
  }

  async function loadClaims() {
    setLoading(true);
    try {
      const data = await window.wf.fetchClaims();
      setClaims(data || []);
    } catch (err) {
      console.error(err);
      showNotif('Load Error', err.message || 'Failed to load claims data.', 'error');
    } finally {
      setLoading(false);
    }
  }

  async function signIn(email, password) {
    setAuthMsg('');
    try {
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        setAuthMsg(error.message);
        throw error;
      }
    } catch (err) {
      setAuthMsg(err.message || 'Sign in failed');
      throw err;
    }
  }

  async function signOut() {
    try {
      await window.supabaseClient.auth.signOut();
      setSession(null);
      setUserProfile(null);
      setClaims([]);
    } catch (err) {
      console.error(err);
      showNotif('Logout Failed', err.message || 'Could not log out.', 'error');
    }
  }

  function handleRoleChange(newRole) {
    if (!isAdmin) {
      showNotif('Access Denied', 'Only Admin users can switch roles.', 'error');
      setRoleView(userProfile?.role || 'field');
      return;
    }
    setRoleView(newRole);
  }

  // Centralized notification function
  function showNotif(title, message, type='success') { setNotif({ open:true, title, message, type }); }
  function hideNotif() { setNotif({ open:false, title:'', message:'', type:'success' }); }

  // Centralized confirmation function
  function openConfirm(title, message, cb) { setConfirmState({ open:true, title, message, cb }); }
  function closeConfirm() { setConfirmState({ open:false, title:'', message:'', cb:null }); }
  function confirmProceed() { if (confirmState.cb) confirmState.cb(); closeConfirm(); }

  // Claim detail open/close handlers
  function openDetail(claim) { setSelectedClaim(claim); setDetailOpen(true); }
  function closeDetail() { setSelectedClaim(null); setDetailOpen(false); } // This is called by the 'hidden.bs.modal' event listener now
  
  // Password modal handlers
  function openPasswordModal() { setPasswordModalOpen(true); }
  function closePasswordModal() { setPasswordModalOpen(false); } 

  // NEW HANDLERS: Add User Modal
  function openAddUserModal() { setAddUserModal(true); }
  function closeAddUserModal() { setAddUserModal(false); }

  // render main
  return (
    <>
      <AppNavbar 
        user={userProfile} 
        roleView={roleView} 
        onRoleChange={handleRoleChange} 
        onLogout={signOut} 
        isAdmin={isAdmin}
        onChangePassword={openPasswordModal}
      />
      {/* Moved container outside AppNavbar and added top padding for sticky header clearance */}
      <div className="container" style={{maxWidth:1200, paddingTop: '40px'}}>
      {!session || !userProfile ? (
        <div className="mt-5">
          <AuthForm onSignIn={signIn} message={authMsg} />
        </div>
      ) : (
        <>
          <div className="row gx-4">
            <div className="col-lg-8">
              <div style={{minHeight: loading ? '300px' : 'auto'}}>
                {roleView === 'field' && <FieldDashboard currentUser={userProfile} claims={claims} onRefresh={loadClaims} onOpenDetail={openDetail} />}
                {roleView === 'sce' && <ApprovalDashboard role="sce" currentUser={userProfile} claims={claims} onRefresh={loadClaims} onOpenDetail={openDetail} showNotif={showNotif} />}
                {roleView === 'manager' && <ApprovalDashboard role="manager" currentUser={userProfile} claims={claims} onRefresh={loadClaims} onOpenDetail={openDetail} showNotif={showNotif} />}
                {roleView === 'admin' && <AdminDashboard 
                    currentUser={userProfile} 
                    claims={claims} 
                    onRefresh={loadClaims} 
                    onOpenDetail={openDetail} 
                    openConfirm={openConfirm} 
                    showNotif={showNotif}
                    openAddUserModal={openAddUserModal} // PASSED HANDLER
                />}
                {loading && <Spinner />}
              </div>
            </div>

            <div className="col-lg-4">
              <div className="card wf-card p-4 mb-4 shadow-lg">
                <h6 className="fw-bold mb-3 text-secondary">Quick Stats</h6>
                <div className="d-flex justify-content-between align-items-center mb-3 p-3 rounded-2 bg-light">
                  <div>
                    <div className="small-muted fw-bold">Total Claims</div>
                    <div style={{color:'var(--wf-primary-dark)'}} className="h4 fw-bolder mt-1">{claims.length}</div>
                  </div>
                  <div className="text-end">
                    <div className="small-muted fw-bold">Pending Approval</div>
                    <div className="h5 fw-bolder text-warning mt-1">{claims.filter(c=>c.status==='Submitted' || c.status==='SCE_Approved').length}</div>
                  </div>
                </div>
              </div>

              <div className="card wf-card p-4 mb-4 shadow-lg">
                <h6 className="fw-bold mb-3 text-secondary">Recent Activity</h6>
                {claims.slice(0,5).map(c => (
                  <div key={c.id} className="d-flex justify-content-between align-items-start border-bottom py-2">
                    <div>
                      <div className="small-muted">{c.customer_name}</div>
                      <div className="fw-bold small">{c.title}</div>
                    </div>
                    <div className="text-end">
                      <div className={`status-pill ${window.wf.getStatusClass(c.status)}`}>{c.status.replace('_',' ')}</div>
                      <div className="small-muted mt-1">{window.wf.formatDate(c.date_raised)}</div>
                    </div>
                  </div>
                ))}
                {claims.length === 0 && <p className="small-muted p-3 text-center">No recent activity</p>}
              </div>

              <div className="card wf-card p-4 shadow-lg">
                <h6 className="fw-bold mb-3 text-secondary">Actions</h6>
                <div className="d-grid gap-3">
                  <button className="btn btn-outline-success fw-bold" onClick={loadClaims}><i className="bi bi-arrow-repeat me-2"></i>Refresh Data</button>
                  <button className="btn btn-outline-secondary fw-bold" onClick={()=>{ navigator.clipboard?.writeText(window.location.href); showNotif('Link Copied','Page URL copied to clipboard.'); }}>
                    <i className="bi bi-share me-2"></i>Share Link
                  </button>
                </div>
              </div>
            </div>
          </div>
        </>
      )}

      {/* Modals are placed outside the main layout for clean rendering */}
      <NotificationModal open={notif.open} title={notif.title} message={notif.message} onClose={hideNotif} type={notif.type} />
      <ConfirmModal open={confirmState.open} title={confirmState.title} message={confirmState.message} onCancel={closeConfirm} onConfirm={confirmProceed} />
      <ClaimDetailModal claim={selectedClaim} open={detailOpen} onClose={closeDetail} />
      <ChangePasswordModal open={passwordModalOpen} onClose={closePasswordModal} showNotif={showNotif} />
      {/* NEW MODAL: Add User Modal */}
      <AddUserModal open={addUserModalOpen} onClose={closeAddUserModal} showNotif={showNotif} /> 
    </div>
    </>
  );
}

/* -----------------------
   Render App
   ----------------------- */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
