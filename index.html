<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warranty Approval System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05); }
    .status-pill { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .btn-primary { background-color: #4f46e5; color: white; transition: background-color 0.2s; }
    .btn-primary:hover { background-color: #4338ca; }
    .input-field { @apply mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500; }
</style>
</head>
<body class="p-4 sm:p-8">

<div id="app" class="max-w-7xl mx-auto">

    <!-- Header -->
    <header class="bg-white shadow-lg p-4 mb-8 rounded-xl flex flex-col md:flex-row justify-between items-center">
        <h1 class="text-3xl font-bold text-indigo-700 mb-4 md:mb-0">WarrantyFlow</h1>
        <div id="auth-controls" class="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4 hidden">
            <p id="user-info" class="text-sm font-medium text-gray-700"></p>
            <div class="flex items-center space-x-2">
                <label for="role-select" class="font-medium text-gray-700 whitespace-nowrap">View as:</label>
                <select id="role-select" class="p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="field">Field Team</option>
                    <option value="sce">SCE</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button id="logout-btn" class="bg-red-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-600 transition">Logout</button>
        </div>
    </header>

    <!-- Auth -->
    <div id="auth-container" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-2xl space-y-6">
        <h2 class="text-3xl font-bold text-center text-indigo-600">Sign In / Register</h2>
        <form id="auth-form" class="space-y-4">
            <div>
                <label for="auth-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="auth-email" required class="input-field">
            </div>
            <div>
                <label for="auth-password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="auth-password" required class="input-field">
            </div>
            <div class="flex space-x-4">
                <button type="button" id="signin-btn" class="w-1/2 btn-primary py-2 rounded-lg font-semibold">Sign In</button>
                <button type="button" id="signup-btn" class="w-1/2 bg-indigo-500 text-white py-2 rounded-lg font-semibold hover:bg-indigo-600 transition">Register</button>
            </div>
        </form>
        <p id="auth-message" class="text-center text-red-500 text-sm hidden"></p>
    </div>

    <!-- Content -->
    <div id="content-area" class="hidden">
        <div id="loading" class="text-center text-indigo-500 p-8">Loading dashboard...</div>
        <div id="field-dashboard" class="hidden"></div>
        <div id="sce-dashboard" class="hidden"></div>
        <div id="manager-dashboard" class="hidden"></div>
        <div id="admin-dashboard" class="hidden"></div>
    </div>

    <!-- Notification Modal -->
    <div id="notification-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center p-4 z-40">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
            <h3 id="modal-title" class="text-xl font-bold mb-3 text-gray-800">Success!</h3>
            <p id="modal-message" class="text-gray-600 mb-4">Your action was completed successfully.</p>
            <button onclick="closeModal()" class="w-full btn-primary py-2 rounded-lg font-semibold">Close</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
            <h3 id="confirm-title" class="text-xl font-bold mb-3 text-gray-800">Confirm Action</h3>
            <p id="confirm-message" class="text-gray-600 mb-4">Are you sure you want to proceed?</p>
            <div class="flex justify-end space-x-3">
                <button id="confirm-cancel" class="bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-semibold hover:bg-gray-300 transition">Cancel</button>
                <button id="confirm-proceed" class="bg-red-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-700 transition">Proceed</button>
            </div>
        </div>
    </div>

</div>

<script type="module">
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentRole = 'field';

// --- Utility Functions ---
function showModal(title, message) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    document.getElementById('notification-modal').classList.remove('hidden');
    document.getElementById('notification-modal').classList.add('flex');
}
function closeModal() {
    document.getElementById('notification-modal').classList.add('hidden');
    document.getElementById('notification-modal').classList.remove('flex');
    loadDashboard();
}
function showConfirmation(title, message, onConfirm) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    document.getElementById('confirmation-modal').classList.remove('hidden');
    document.getElementById('confirmation-modal').classList.add('flex');
    document.getElementById('confirm-proceed').onclick = () => { document.getElementById('confirmation-modal').classList.add('hidden'); onConfirm(); };
    document.getElementById('confirm-cancel').onclick = () => { document.getElementById('confirmation-modal').classList.add('hidden'); };
}
function getStatusColor(status) {
    switch(status){
        case 'Submitted': return 'bg-yellow-100 text-yellow-800';
        case 'SCE_Approved': return 'bg-blue-100 text-blue-800';
        case 'SCE_Rejected': return 'bg-red-100 text-red-800';
        case 'Manager_Approved': return 'bg-green-100 text-green-800';
        case 'Manager_Rejected': return 'bg-red-100 text-red-800';
        case 'Admin_Closed': return 'bg-red-200 text-red-900';
        default: return 'bg-gray-100 text-gray-600';
    }
}

// --- Authentication ---
async function handleSignUp() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) { document.getElementById('auth-message').textContent = error.message; document.getElementById('auth-message').classList.remove('hidden'); }
    else showModal('Success', 'Registered! Please confirm your email.');
}
async function handleSignIn() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) { document.getElementById('auth-message').textContent = error.message; document.getElementById('auth-message').classList.remove('hidden'); }
}
async function handleSignOut() { await supabase.auth.signOut(); }

// --- Fetch Claims ---
async function fetchClaims() {
    if(!currentUser) return [];
    const { data, error } = await supabase.from('claims').select('*').order('date_raised',{ascending:false});
    if(error){console.error(error); return [];}
    return data || [];
}

// --- Submit Claim ---
async function submitClaim(payload) {
    payload.user_id = currentUser.id;
    payload.status = 'Submitted';
    const { error } = await supabase.from('claims').insert([payload]);
    if(error) showModal('Error', error.message);
    else showModal('Success', 'Claim submitted!');
}

// --- Update Approval ---
async function updateClaimApproval(claimId, action, notes) {
    if(currentRole==='sce') {
        const { error } = await supabase.rpc('approve_claim_sce',{claim_id:claimId, approve: action==='approve', notes:notes, user_id:currentUser.id});
        if(error) showModal('Error', error.message);
        else showModal('Success', `SCE ${action}d claim!`);
    } else if(currentRole==='manager') {
        const { error } = await supabase.rpc('approve_claim_manager',{claim_id:claimId, approve: action==='approve', notes:notes, manager_id:currentUser.id});
        if(error) showModal('Error', error.message);
        else showModal('Success', `Manager ${action}d claim!`);
    }
}

// --- Render Dashboards ---
function renderClaimItem(claim, showActions=false) {
    const statusClass = getStatusColor(claim.status);
    let actions = '';
    if(showActions && ((currentRole==='sce' && claim.status==='Submitted') || (currentRole==='manager' && claim.status==='SCE_Approved'))) {
        actions = `<textarea id="notes-${claim.id}" placeholder="Notes"></textarea>
                   <button onclick="handleApprovalClick('${claim.id}','approve')">Approve</button>
                   <button onclick="handleApprovalClick('${claim.id}','reject')">Reject</button>`;
    }
    return `<div class="card p-4 border rounded-lg mb-2">
                <div class="flex justify-between"><h3>${claim.title}</h3><span class="${statusClass}">${claim.status}</span></div>
                ${actions}
            </div>`;
}

window.handleApprovalClick = (claimId, action) => {
    const notes = document.getElementById(`notes-${claimId}`)?.value || '';
    showConfirmation('Confirm', `Are you sure to ${action} this claim?`, () => updateClaimApproval(claimId, action, notes));
};

async function loadDashboard() {
    if(!currentUser) return;
    document.getElementById('loading').classList.remove('hidden');
    const claims = await fetchClaims();
    document.getElementById('loading').classList.add('hidden');

    // Render per role
    const dashboards = { field: 'field-dashboard', sce: 'sce-dashboard', manager: 'manager-dashboard', admin: 'admin-dashboard' };
    for(const key in dashboards) document.getElementById(dashboards[key]).classList.add('hidden');

    let dashboardEl = document.getElementById(dashboards[currentRole]);
    let filteredClaims = [];
    switch(currentRole){
        case 'field': filteredClaims = claims; break;
        case 'sce': filteredClaims = claims.filter(c=>c.status==='Submitted'); break;
        case 'manager': filteredClaims = claims.filter(c=>c.status==='SCE_Approved'); break;
        case 'admin': filteredClaims = claims; break;
    }
    dashboardEl.innerHTML = filteredClaims.map(c=>renderClaimItem(c,true)).join('') || '<p class="text-gray-500 p-4">No claims to display.</p>';
    dashboardEl.classList.remove('hidden');
}

// --- Initialization ---
supabase.auth.onAuthStateChange((event, session)=>{
    currentUser = session?.user || null;
    if(currentUser){
        document.getElementById('auth-container').classList.add('hidden');
        document.getElementById('content-area').classList.remove('hidden');
        document.getElementById('auth-controls').classList.remove('hidden');
        document.getElementById('user-info').textContent = `Logged in as ${currentUser.email}`;
        loadDashboard();
    } else {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('content-area').classList.add('hidden');
        document.getElementById('auth-controls').classList.add('hidden');
    }
});

document.getElementById('signin-btn').addEventListener('click', handleSignIn);
document.getElementById('signup-btn').addEventListener('click', handleSignUp);
document.getElementById('logout-btn').addEventListener('click', handleSignOut);
document.getElementById('role-select').addEventListener('change',(e)=>{currentRole=e.target.value; loadDashboard();});

</script>
</body>
</html>
